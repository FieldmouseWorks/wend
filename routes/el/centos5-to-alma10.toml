[meta]
name = "centos5-to-alma10"
summary = "CentOS 5.11 (2007 lineage) to AlmaLinux 10, through EL8 in one hop, proven on a web/database box and a DNS/FTP box"
note = "Proven in chroots, userland only: services are not enabled at boot. CentOS 5's chkconfig settings don't carry over to systemd units, so after a real reboot httpd, php-fpm, mariadb, named and vsftpd stay down until enabled by hand (systemctl enable)."
