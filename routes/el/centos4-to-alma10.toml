[meta]
name = "centos4-to-alma10"
summary = "CentOS 4.9 to AlmaLinux 10: one new hop onto CentOS 5, then the CentOS 5 route's fixes"
note = "The CentOS 4 -> 5 hop is yum 2.4's upgrade (EL4 has no distro-sync), with the harness's steps for EL4 (adapters/el.toml releases.centos5.upgrade: CentOS 4's Python 2.3 builds of python-elementtree and python-sqlite, which yum won't replace with CentOS 5's) and one fix, el5-drop-i386-multilib. From CentOS 5 on, the fixes and their order are routes/el/centos5-to-alma10.toml's; see its note for what is carried and checked. Proven in chroots on el/centos4-dns."
