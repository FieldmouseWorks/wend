[meta]
name = "centos7-to-alma10"
summary = "CentOS 7.9 to AlmaLinux 10, through EL8 in one hop, proven on a LAMP box that carries EPEL"
note = "Starts from boxes installed natively on CentOS 7 (systemd, NetworkManager, firewalld) and carries EPEL along (SPEC \"Add-on repositories\"): el8-transit-epel refuses before changing anything if an EPEL package has no EL8 successor. fail2ban sits out EL8 (el9-fail2ban-through-el8), whose EPEL build needs a module stream the pass-through never enables; for the same reason mod_ssl and the PHP extensions are installed again on EL9. Boot enablement is recorded from systemd before the pass-through (el9-record-boot-services) and carried by the CentOS 5 route's rungs from EL9 on. The owner's php.ini and httpd.conf changes are not carried (el10-httpd-php-config keeps them under /var/lib/wend/saved). Container tier only so far: no real-VM proof yet."
