# The Ubuntu adapter: the Debian adapter's apt/dpkg engine on Ubuntu's LTS ladder. Everything apt/dpkg-specific that
# fixes may not say for themselves lives here. See SPEC.md, "Adapters".
schema = "wend.adapter/0"
family = "ubuntu"
backend = "apt"
force = ["depends", "remove-essential"]
release_file = "/etc/lsb-release"    # /etc/debian_version on Ubuntu names Debian's testing ("jessie/sid"), not the release

# LTS to LTS, the way do-release-upgrade goes: one hop = one LTS. Interim releases are never stops.
ladder = ["trusty", "xenial", "bionic", "focal", "jammy", "noble", "resolute"]

harness_owned = ["/etc/apt/sources.list", "/etc/apt/sources.list.d/", "/etc/apt/apt.conf.d/00wend"]

# Same allowlist as Debian, for the same reasons (see adapters/debian.toml).
writable = [
  "/etc/apache2/sites-available/*.conf",
  "/etc/apache2/conf-available/*.conf",
  "/etc/mysql/conf.d/*.cnf",
  "/etc/mysql/mariadb.conf.d/*.cnf",
  "/etc/mysql/mysql.conf.d/*.cnf",
]

[mirror]
# tools/mirror.py, the shim EL and Debian use (the same port: one shim serves all three). It reaches the archive over
# https for the box: trusty's apt has no https of its own (SPEC "Signed packages").
shim = "http://127.0.0.1:8085"
probe = "archive.ubuntu.com/ubuntu/dists/trusty/Release"

[releases]
# Ubuntu moves a release to old-releases.ubuntu.com some time after its support ends; every LTS from trusty on is
# still on the main archive (ESM keeps them there). The release pocket only: it is frozen at release time, so a hop's
# pinned Release file stays good. -updates and -security move, and a route that read them couldn't be replayed.
# Both go through the [mirror] shim, which reaches them over https: trusty's apt 1.0 has no https of its own.
archive = "old-releases.ubuntu.com/ubuntu"
current = "archive.ubuntu.com/ubuntu"
current_from = "trusty"
# `signed`: the hop into the release checks the archive's signatures (SPEC "Signed packages"). Checked with gpgv
# against the keyring the box has on the release before (ubuntu-keyring in its release pocket): every Release from
# xenial to resolute has a good signature by a key the box already trusts.

[releases.trusty]
# tools/vm.py installs a VM box with trusty's own debian-installer: its netboot kernel and initrd under the mirror.
# trusty's 3.13 knows virtio, so the machine is the default one. The preseed lines are trusty's installer's own
# spellings, with no security or updates service. The installer still adds -updates, so tools/vm.py gives it a mirror
# that offers the release pocket only (release_pocket_only): the box is the release pocket's, as the chroot box is and
# as the route's hops read. GRUB 2 gets the serial console on the kernel command line.
install = { netboot = "dists/trusty/main/installer-amd64/current/images/netboot/ubuntu-installer/amd64", release_pocket_only = true, uefi = true, preseed = [
  "d-i keyboard-configuration/xkb-keymap select us",
  "d-i console-setup/ask_detect boolean false",
  "d-i mirror/country string manual",
  "d-i apt-setup/services-select-ubuntu multiselect",
  "d-i base-installer/kernel/image string linux-generic",
  "d-i partman-auto/disk string /dev/vda",
  "d-i partman-auto/choose_recipe select atomic",
  "d-i partman/choose_partition select finish",
  "d-i partman/confirm_nooverwrite boolean true",
  "d-i grub-installer/bootdev string /dev/vda",
  "d-i pkgsel/update-policy select none",
  "d-i pkgsel/upgrade select none",
], late = "in-target sed -i 's/^GRUB_CMDLINE_LINUX=\"/GRUB_CMDLINE_LINUX=\"console=tty0 console=ttyS0,115200 /' /etc/default/grub; in-target update-grub" }

[releases.xenial]
signed = true
# mysql-server-5.7's postinst runs mysql_upgrade against the server it has just started, then stops it, runs an init
# file through a bootstrap server, and starts it again. On a real machine the init script does all that; in the
# sandbox policy-rc.d keeps every daemon down, so the configure fails. Only then, and only for MySQL, the harness
# finishes the configure with a stand-in policy-rc.d that starts and stops 5.7's own mysqld itself (socket only, no
# TCP, no inherited descriptors) whenever the postinst asks for mysql, and still denies the init script. The server
# is down and the box's own policy-rc.d is back before the hop goes on. Boxes without MySQL never get here.
upgrade = ['''apt-get dist-upgrade || {
dpkg-query -W -f '${Status}' mysql-server-5.7 2>/dev/null | grep -q half-configured || exit 1
cp -p /usr/sbin/policy-rc.d /tmp/wend-policy-rc.d || exit 1
cat > /usr/sbin/policy-rc.d <<'WEND_EOF'
#!/bin/sh
case " $* " in *" mysql "*) ;; *) exit 101;; esac
case " $* " in *stop*|*restart*)
  mysqladmin --defaults-file=/etc/mysql/debian.cnf shutdown >/dev/null 2>&1 || pkill -x mysqld
  i=0; while pgrep -x mysqld >/dev/null && [ $i -lt 120 ]; do sleep 1; i=$((i+1)); done;;
esac
case " $* " in *start*)
  mkdir -p /var/run/mysqld && chown mysql:mysql /var/run/mysqld
  /usr/sbin/mysqld --user=mysql --skip-networking </dev/null >/dev/null 2>&1 &
  i=0; while [ $i -lt 120 ] && ! mysqladmin --defaults-file=/etc/mysql/debian.cnf ping >/dev/null 2>&1; do sleep 1; i=$((i+1)); done;;
esac
exit 101
WEND_EOF
dpkg --configure -a; rc=$?
/usr/sbin/policy-rc.d mysql stop
pkill -x mysqld; i=0; while pgrep -x mysqld >/dev/null && [ $i -lt 60 ]; do sleep 1; i=$((i+1)); done
pkill -KILL -x mysqld
cp -p /tmp/wend-policy-rc.d /usr/sbin/policy-rc.d || exit 1
rm -f /tmp/wend-policy-rc.d
[ $rc = 0 ] && apt-get dist-upgrade
}''', "apt-get autoremove --purge"]

[releases.jammy]
signed = true
# Noble needs a merged /usr: its libc6 preinst diverts /lib64 and fails ("cannot divert directories") while /lib64
# is still a real directory, and every box that came up the ladder from trusty has one. Noble no longer ships
# usrmerge, so the merge happens on arrival at jammy, with jammy's own usrmerge, like do-release-upgrade's quirk.
# A box that is already merged gets a no-op. A route with finish.prune_obsolete purges usrmerge once a later release
# no longer ships it (noble doesn't).
upgrade = ["apt-get dist-upgrade", "apt-get autoremove --purge", "apt-get install usrmerge"]

[box]
# Debian's debootstrap knows every Ubuntu release as the "gutsy" script, but Ubuntu 24.04's own package (the CI
# runner's) only links it for lunar and later. Named explicitly, so building a trusty box doesn't depend on the host.
debootstrap_script = "gutsy"

[releases.bionic]
signed = true

[releases.focal]
signed = true

[releases.noble]
signed = true

[releases.resolute]
signed = true

[hop]
# Third-party sources (PPAs) are set aside, not deleted, the way do-release-upgrade disables them: a PPA built for the
# old release would pull packages across the hop. They stay in sources.list.d as *.wend-disabled for the admin.
set_release = "{apt_conf} && printf 'deb {mirror} {release} main restricted universe multiverse\\n' > /etc/apt/sources.list && for f in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do [ ! -f \"$f\" ] || mv \"$f\" \"$f.wend-disabled\" || exit 1; done"
refresh = "apt-get update"
upgrade = ["apt-get dist-upgrade", "apt-get autoremove --purge"]
verify = "grep -qx 'DISTRIB_CODENAME={release}' /etc/lsb-release"
# SPEC "Kernels and the bootloader": a trusty install with guided LVM puts /boot on 243 MB, and apt's autoremove
# keeps two old kernels beside the new one, so past focal the next kernel and its initramfs don't fit and the hop dies half done.
# Before each hop's transaction, on a machine booted from this root, the harness purges every kernel older than the
# running one with all its packages (image, extra modules, headers), so /boot holds the running kernel and the one the
# hop brings. A kernel newer than the running one (installed, not booted yet) stays. So does an old kernel that
# something still depends on (a metapackage pinned to it, say, while the machine runs an -updates or HWE kernel) or
# that is on hold: each old kernel is tried with dpkg --no-act first and kept and named if dpkg would refuse. Preflight
# counts neither those nor a newer kernel waiting for a reboot, so after the purge the hop goes on only if /boot has
# the room the release's kernel needs (hardware.<release>.boot_mib), and otherwise stops here, before its transaction. A machine running a kernel that
# isn't Ubuntu's (a provider's) keeps all of them. dpkg, not apt: it never takes anything else with it.
kernel_before = [
  "[ / -ef /proc/1/root ] || { echo \"not booted from this root: kernels left as they are\"; exit 0; }; case $(uname -r) in [0-9]*.[0-9]*.[0-9]*-[0-9]*-*) ;; *) echo \"the running kernel $(uname -r) is not an Ubuntu one: kernels left as they are\"; exit 0;; esac; O=$(dpkg-query -W -f '${Status} ${Package}\\n' 2>/dev/null | awk -v r=\"$(uname -r)\" 'function key(v, n) {split(v, n, /[.-]/); return sprintf(\"%05d%05d%05d%05d\", n[1], n[2], n[3], n[4])} BEGIN {split(r, x, \"-\"); rk = key(x[1] \"-\" x[2])} $3 == \"installed\" && $4 ~ /^linux-/ {p[$4] = 1; h[$4] = ($1 == \"hold\")} END {for (q in p) if (match(q, /^linux-(image|image-unsigned|signed-image|image-extra)-[0-9]+[.][0-9]+[.][0-9]+-[0-9]+/)) {a = substr(q, RSTART, RLENGTH); sub(/^linux-[a-z-]*-/, \"\", a); if (key(a) < rk) old[a] = 1} for (q in p) for (a in old) if (index(q \"-\", \"-\" a \"-\")) print a, q, h[q]}' | sort); L=; K=; for a in $(echo \"$O\" | cut -d' ' -f1 | sort -u); do P=$(echo \"$O\" | awk -v a=\"$a\" '$1 == a {print $2}'); if echo \"$O\" | awk -v a=\"$a\" '$1 == a && $3 == 1 {f = 1} END {exit !f}'; then K=\"$K $a\"; echo \"keeping the kernel $a: a package of it is on hold\"; elif dpkg --no-act --purge $P >/dev/null 2>&1; then L=\"$L $P\"; else K=\"$K $a\"; echo \"keeping the kernel $a: something still depends on it:\" $(dpkg --no-act --purge $P 2>&1 | sed -n 's/^ *\\(.* depends on .*\\)[.]$/\\1/p' | sort -u | head -n 3); fi; done; if [ -n \"$L\" ]; then echo \"purging kernels older than the running $(uname -r):\" $L; dpkg --purge $L || exit 1; fi; F=$(df -Pm /boot | awk 'NR == 2 {print $4}'); echo \"/boot has $F MiB free\"; [ \"${F:-0}\" -ge {boot_mib} ] || { echo \"/boot has $F MiB free and {release}'s kernel needs about {boot_mib}; it holds $(cd /boot && echo vmlinuz-*)${K:+ (kept:$K)}: remove the kernels it doesn't need (take them off hold, or remove what depends on them), or grow /boot\"; exit 1; }",
]
autoremove = "apt-get autoremove --purge"
after = ["apt-get clean"]
obsolete = "apt-get update >/dev/null 2>&1; apt list '?obsolete' 2>/dev/null | grep / | cut -d/ -f1"
installed_list = "dpkg-query -W -f '${Status} ${Package}\\n' | awk '$3==\"installed\"{print $4}'"
# tools/vm.py: the newest installed kernel, as `uname -r` names it (the package name after linux-image-, compared by its
# numbers); after every reboot it has to be the running one. The signed image is linux-image-*, the unsigned one
# linux-image-unsigned-*, which the pattern leaves out.
kernel_newest = "dpkg-query -W -f '${Status} ${Package}\\n' 'linux-image-[0-9]*' 2>/dev/null | awk '$3 == \"installed\" && $4 !~ /-dbg$/ {v = $4; sub(/^linux-image-/, \"\", v); split(v, n, /[.-]/); k = sprintf(\"%05d%05d%05d%05d\", n[1], n[2], n[3], n[4]); if (k > best) {best = k; out = v}} END {if (out != \"\") print out}'"
apt_conf = """APT::Get::Assume-Yes "true";
APT::Get::allow-downgrades "true";
APT::Get::allow-remove-essential "true";
APT::Get::allow-change-held-packages "true";
Acquire::Check-Valid-Until "false";
Dpkg::Options { "--force-confdef"; "--force-confold"; };
"""
# SPEC "Signed packages": appended to apt_conf on a hop into a release that isn't `signed`, whose archive signatures
# the box's keyring can't check any more (expired keys). force-yes also lets apt install what it couldn't
# authenticate, so it lives here too; apt from 1.1 on reads the allow-* options above instead.
apt_unsigned = """APT::Get::force-yes "true";
APT::Get::AllowUnauthenticated "true";
Acquire::AllowInsecureRepositories "true";
"""

[predicates]
installed = "dpkg-query -W -f '${Status}' {pkg} 2>/dev/null | grep -q 'ok installed'"
file = "test -f {path}"
file-contains = "grep -qF '{text}' {path}"
mysql-option = '''g=$( (mysqld --verbose --help || /usr/sbin/mysqld --verbose --help || mariadbd --verbose --help || /usr/sbin/mariadbd --verbose --help) 2>/dev/null | sed -n 's/^The following groups are read: //p' | head -n 1); [ -n "$g" ] && my_print_defaults --defaults-file={path} $g 2>/dev/null | awk -v k='--{key}' -v v='{value}' -v any={any} '{ n = $0; sub(/=.*/, "", n); gsub(/_/, "-", n); if (n == k) { f = 1; x = $0; sub(/^[^=]*=?/, "", x) } } END { exit !(f && (any || x == v)) }''''

[pm_options.overwrite-conflicting-files]
path = "/etc/apt/apt.conf.d/50overwrite"
content = "Dpkg::Options { \"--force-overwrite\"; };\n"

[ops."apache.enable"]
summary = "a2ensite / a2enmod / a2enconf"
args = { kind = { enum = ["site", "mod", "conf"] }, name = { pattern = "[A-Za-z0-9_.-]+" } }

[ops."apache.disable"]
summary = "a2dissite / a2dismod / a2disconf"
args = { kind = { enum = ["site", "mod", "conf"] }, name = { pattern = "[A-Za-z0-9_.-]+" } }

[ops."net.ifupdown-dns-to-resolved"]
summary = "give systemd-resolved the resolvers and search domains ifupdown names for the interfaces it has up (ifquery --state; a resolved.conf.d drop-in); fails, changing nothing, on any dns option or value it can't carry"
args = {}

[ops."apt.drop-esm-pins"]
summary = "remove the apt pins ubuntu-advantage-tools wrote for the release being left (Pin-Priority: never, which apt 1.2 on rejects); only unowned plain files in u-a-t's exact shape"
args = { release = { pattern = "[a-z]+" } }

[checks]
pkgdb = 'test -z "$(dpkg --audit 2>&1)" && apt-get check >/dev/null'
current = "every binary a service runs comes from a package the release in sources.list still ships (apt-cache madison); the box lists the binaries"
services = "no explicitly installed, non-required package that ships an init script or unit belongs to a name family the box did not have at the start"

[hardware]
# SPEC "Hardware preflight": what a machine needs before a route boots it into each release, checked before the first
# hop touches anything. `boot` is the firmware wend's kernel steps are proven to carry a real machine through (a VM
# replay of every box on the routes, by BIOS or with tools/vm.py --uefi); any other mode is refused. Per release: `cpu`, the
# release's x86-64 level (its glibc refuses anything lower: "Fatal glibc error: CPU does not support x86-64-v2");
# `ram_mib`, Ubuntu Server's documented minimum for a cloud image (24.04's figure, which 26.04's docs still give;
# 16.04 to 22.04 publish none we could find, so those releases have no ram_mib); `disk_mib`, an estimate of the free
# space on / the hop needs (its downloads and the release's growth; walking a copy of the machine first measures the
# real need); `drivers`, the sha256 of
# adapters/drivers/ubuntu/<release>.txt, the PCI disk controllers and network cards the release's kernel drives
# and the filesystems it mounts (tools/hwdata.py builds it from the kernel package itself).
# `boot_mib`, the space the release's kernel takes in /boot: linux-image's and linux-modules' /boot files (measured)
# and its initramfs, with room for an LVM or md root. xenial to jammy: the initrds the VM tier's trusty-to-resolute
# run made on its plain-partition box (37, 50, 48 and 62 MB for the route's pinned 4.4.0-21, 4.15.0-20, 5.4.0-26 and
# 5.15.0-25), plus 5 MiB, what lvm2 and mdadm add to the same kernels' initrds (4.7 MB on 5.4.0-26, 4.9 on
# 5.15.0-25, built in a container with and without them), plus a little. noble: built from the release's packages
# in a container, with lvm2 and mdadm. resolute: the same run's 79.8 MB initrd for 7.0.0-14 (a container build is
# host-only and far smaller), its 28.6 MiB of package files, the 5 MiB, and a little.
# `old_kernels = "running"`: hop.kernel_before purges every kernel older than the running one before the
# transaction, so the new kernel only ever sits beside the running one (apt's autoremove would keep two, and trusty's
# guided-LVM /boot of 243 MB stops at focal). `boot`: every box on the route (trusty-web, trusty-db,
# trusty-web-updated) passed trusty -> resolute on UEFI (tools/vm.py --uefi, OVMF without Secure Boot) as on BIOS,
# rebooting onto UEFI at every hop (wend#13); Secure Boot isn't proven.
boot = ["bios", "uefi"]
old_kernels = "running"

