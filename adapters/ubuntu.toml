# SPEC "Runtime preflight": the Python 2 interpreters each release a route boots into ships, by upstream version
# ([] for none). tools/runtimes.py reads them from the release's own index (the components the hop uses); a machine
# whose own programs run on Python 2 is told where it stops shipping before anything is touched. `libs` pins the
# release's library table, xz-compressed (from tools/sonames.py; kept out of git, in the wend archive at this digest and
# in the release tarball): the sonames its packages ship, which the machine's own native programs and libraries (no
# package owns them) are held to.
[runtimes.xenial]
python2 = ["2.7.11"]
libs = "sha256:d533c3471902f5bc479d53fbd3ea752cf7f8e3a429f1f8335bd4e0f6766c804b"

