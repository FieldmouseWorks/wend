# The Enterprise Linux adapter: CentOS 5 to AlmaLinux 10, everything rpm/yum/dnf-specific that fixes may not say for
# themselves. What each op does is in SPEC.md, "Op reference" (rpm backend). Written from dep-lab's
# CentOS round (co.py, 2026-10-10/11), where Opus found the route and a fix library replayed it on two boxes.
schema = "wend.adapter/0"
family = "el"
backend = "rpm"
release_file = "/etc/redhat-release"

# Release ids carry the vendor: the ladder crosses from CentOS to AlmaLinux at 8 (open question 5 in SPEC.md).
ladder = ["centos5", "centos6", "centos7", "centos8", "alma8", "alma9", "alma10"]
# A route may leave these out of its hops. EL8 is only ever a bootstrap step: rpm.transit lands the box on EL8 and
# the same hop's transaction takes it on to EL9, so no health check ever runs on EL8. CentOS 8 is where boxes start,
# never where a route lands (it ended in 2021): routes from EL7 and earlier step over it, and routes from it go
# straight to EL9 with EL8's own dnf.
may_skip = ["centos8", "alma8"]

# The harness owns the repo configuration, like sources.list on Debian, and clears the vendor .repo files every
# release package drops there (they point at mirrors that are gone).
harness_owned = ["/etc/yum.repos.d/", "/etc/yum.conf", "/etc/yum/", "/etc/dnf/", "/etc/wend/"]

# The only files write-file may write (kv.* has its own per-key list at the end). An allowlist; growing it is a spec change (see debian.toml).
writable = ["/etc/my.cnf"]

# Config files rpm.adopt-rpmnew and rpm.set-aside-unowned may move. They never write content: one takes the file the
# package itself shipped as .rpmnew, the other moves a file no installed package owns. Both keep the old file under
# /var/lib/wend/saved.
managed = [
  "/etc/my.cnf",
  "/etc/httpd/conf/httpd.conf",
  "/etc/httpd/conf.d/*.conf",
  "/etc/httpd/conf.modules.d/*.conf",
  "/etc/php.ini",
  "/etc/php.d/*.ini",
  "/etc/php-fpm.conf",
  "/etc/php-fpm.d/*.conf",
]

# force-remove's flags on rpm: --nodeps, --noscripts. No --justdb: a fix that drops a package from the database
# and leaves its files would fake the pkgdb check.
force = ["depends", "scripts"]

[mirror]
# CentOS 5's yum can't speak today's TLS and the vaults are https-only now. The harness runs tools/mirror.py on the
# host (an http -> https cache for a fixed list of hosts) and every repo URL goes through it.
shim = "http://127.0.0.1:8085"
probe = "vault.centos.org/5.11/os/x86_64/repodata/repomd.xml"

[releases.centos5]
major = 5
pm = "yum"
repos = { base = "vault.centos.org/5.11/os/x86_64", updates = "vault.centos.org/5.11/updates/x86_64" }
# tools/vm.py installs a VM box with the release's own installer: its tree (through the shim) and the pxeboot dir in it
install = { tree = "vault.centos.org/5.11/os/x86_64", pxeboot = "images/pxeboot", packages = ["grub"] }

[releases.centos6]
major = 6
pm = "yum"
repos = { base = "vault.centos.org/6.10/os/x86_64", updates = "vault.centos.org/6.10/updates/x86_64" }
upgrade = ["yum -y upgrade"]
# EL6 binaries can't run on the EL5 kernel (EL6's apr asks for SOCK_CLOEXEC): on a real machine, boot the new kernel
# before the post steps run them (SPEC "Kernels and the bootloader")
reboot = "before-post"

[releases.centos6.bootstrap]
# rpm.bootstrap: EL6's rpm, yum and python stack, unpacked over / with 7-Zip from archived EPEL 5
p7zip_repo = "archives.fedoraproject.org/pub/archive/epel/5/x86_64"
# pinned by digest (EPEL 5's primary.xml lists their SHA-1; these are the sha256 of those same files): the hop
# refuses anything else, and its sources record them
p7zip = { "p7zip-9.20.1-2.el5.x86_64.rpm" = "sha256:8f5feea09ccbd75e7972c00aa04269ec2ef3db3f7c08875aef8806bae4b173da", "p7zip-plugins-9.20.1-2.el5.x86_64.rpm" = "sha256:49ed9ca05f0da717b3d18b80f8d1b1e132c439d1b25c902629a8f7abee9a2476" }
packages = ["glibc", "glibc-common", "libgcc", "nss-softokn-freebl", "nss-softokn", "nss", "nss-util", "nspr",
            "nss-sysinit", "rpm", "rpm-libs", "rpm-python", "popt", "xz-libs", "xz", "lua", "file-libs", "sqlite",
            "db4", "libselinux", "libcap", "libacl", "libattr", "elfutils-libelf", "bzip2-libs", "zlib", "python",
            "python-libs", "libffi", "gdbm", "expat", "readline", "ncurses-libs", "openssl", "krb5-libs",
            "keyutils-libs", "libcom_err", "libidn", "openldap", "cyrus-sasl-lib", "libssh2", "libcurl",
            "python-pycurl", "python-urlgrabber", "python-iniparse", "yum", "yum-metadata-parser", "glib2",
            "libxml2", "pygpgme", "gpgme", "libgpg-error", "libassuan", "pth"]

[releases.centos7]
major = 7
pm = "yum"
repos = { base = "vault.centos.org/7.9.2009/os/x86_64", updates = "vault.centos.org/7.9.2009/updates/x86_64" }
# anaconda's EL7 kickstart: sections end with %end, GRUB 2, and eth0 (net.ifnames=0) as the box's network role expects,
# named by MAC on the installer's boot line (ifname), so the installer writes the HWADDR pin the box has; /boot the
# 1 GiB 7.9's installer makes by default (blivet's platform.py; boot_part_mib);
# EL7's installer installs on UEFI (an EFI system partition, grub2-efi and shim) and makes ext3, XFS v5 or, with
# mkfs options, XFS v4 (box [vm].root_fs)
install = { tree = "vault.centos.org/7.9.2009/os/x86_64", pxeboot = "images/pxeboot", packages = ["grub2"], ks_end = true, append = "net.ifnames=0 biosdevname=0", ifname = true, boot_part_mib = 1024, uefi = true, root_fs = ["ext3", "xfs", "xfs-v4"] }
# el6's grep is newer than el7's, so `upgrade` leaves it behind; distro-sync takes everything to el7's version
upgrade = ["yum -y distro-sync"]

[releases.centos8]
major = 8
pm = "dnf"
repos = { baseos = "vault.centos.org/8.5.2111/BaseOS/x86_64/os", appstream = "vault.centos.org/8.5.2111/AppStream/x86_64/os" }

[releases.alma8]
major = 8
pm = "dnf"
repos = { baseos = "repo.almalinux.org/almalinux/8/BaseOS/x86_64/os", appstream = "repo.almalinux.org/almalinux/8/AppStream/x86_64/os" }

[releases.alma8.transit]
# rpm.transit: a temporary EL7 dnf (from CentOS 7 extras) downloads the EL8 set, EL8's own rpm installs it
from = "centos7"
extra_repos = { extras = "vault.centos.org/7.9.2009/extras/x86_64" }
release_package = "almalinux-release"

[releases.alma9]
major = 9
pm = "dnf"
repos = { baseos = "repo.almalinux.org/almalinux/9/BaseOS/x86_64/os", appstream = "repo.almalinux.org/almalinux/9/AppStream/x86_64/os" }
# EL8 module streams don't exist on EL9: reset them, and tell dnf which platform it is on (a chroot has no os-release
# it trusts yet). EL9's rpm only reads EL8's Berkeley DB read-only, so the database is rebuilt (as sqlite) before any
# fix installs anything.
upgrade = ["rm -f /etc/dnf/modules.d/*.module",
           "{clean_repos}; dnf -y {dnf_opts} --nobest --setopt=module_platform_id=platform:el9 distro-sync",
           "/usr/sbin/ldconfig; rm -f /var/lib/rpm/__db.*; rpmdb --rebuilddb && rpm -q rpm"]

[releases.alma10]
major = 10
pm = "dnf"
repos = { baseos = "repo.almalinux.org/almalinux/10/BaseOS/x86_64/os", appstream = "repo.almalinux.org/almalinux/10/AppStream/x86_64/os" }
# download first, with retries: 1100 packages from a live mirror; the second attempt only fetches what's missing
upgrade = ["rm -f /etc/dnf/modules.d/*.module",
           "{clean_repos}; O='{dnf_opts} --nobest --setopt=module_platform_id=platform:el10 --setopt=retries=10'; dnf -y $O --downloadonly distro-sync >/tmp/wend-dl.log 2>&1 || dnf -y $O --downloadonly distro-sync",
           "dnf -y {dnf_opts} --nobest --setopt=module_platform_id=platform:el10 distro-sync"]

# Add-on repositories (SPEC "Add-on repositories"). A box with the marker package installed keeps the add-on along the
# route: every hop's repo file also lists the add-on's repo for the release it enters, and rpm.transit lets the
# vendor's packages through, but only if each one has a package of the same name in the next release's repos or
# add-on repos. Anything else still stops the transit before it changes the box, so a fix has to remove or replace it.
# EPEL's own key and repo files come with epel-release; the harness owns /etc/yum.repos.d like the vendor's.
[addons.epel]
marker = "epel-release"
vendor = "Fedora Project"
repos = { centos7 = "archives.fedoraproject.org/pub/archive/epel/7/x86_64", centos8 = "dl.fedoraproject.org/pub/epel/8/Everything/x86_64", alma8 = "dl.fedoraproject.org/pub/epel/8/Everything/x86_64", alma9 = "dl.fedoraproject.org/pub/epel/9/Everything/x86_64", alma10 = "dl.fedoraproject.org/pub/epel/10/Everything/x86_64" }

[hop]
# What the harness runs for every hop, around the fixes' pre and post steps. {placeholders} come from the release
# being entered (SPEC.md, "Adapter format"); fixes can't change any of it.
set_release = "rm -f /etc/yum.repos.d/*.repo && printf '{repofile}' > /etc/yum.repos.d/ladder.repo && {addons}"
refresh = "rm -f /var/lib/rpm/__db.*; rpm --rebuilddb && {pm} clean all"
upgrade = ["{pm} -y distro-sync"]
verify = "grep -q 'release {major}[. ]' /etc/redhat-release"
after = [
  "{clean_repos}",
  "/usr/sbin/ldconfig 2>/dev/null || /sbin/ldconfig",
  # EL10's rpm keeps its database in /usr/lib/sysimage/rpm; move it there and leave a symlink
  "D=$(rpm --eval '%{_dbpath}'); if [ \"$D\" != /var/lib/rpm ] && [ ! -L /var/lib/rpm ] && [ -s /var/lib/rpm/rpmdb.sqlite ] && [ ! -s \"$D/rpmdb.sqlite\" ]; then mkdir -p \"$D\" && cp -a /var/lib/rpm/. \"$D\"/ && rm -rf /var/lib/rpm && ln -s \"$D\" /var/lib/rpm; fi",
  "rm -f /var/lib/rpm/__db.*; rpm --rebuilddb",
  "{pm} clean packages",
]
installed_list = "rpm -qa --qf '%{NAME}\\n' | sort -u"
# tools/vm.py: the newest installed kernel, as `uname -r` would name it; after every reboot it has to be the running one
kernel_newest = "rpm -q --qf '%{INSTALLTIME} %{VERSION}-%{RELEASE}.%{ARCH}\\n' kernel-core kernel 2>/dev/null | grep -v 'is not installed' | sort -n | tail -n1 | cut -d' ' -f2"
# A real machine's kernel (SPEC "Kernels and the bootloader"). A chroot box has none, and these do nothing there. The
# old release's kernel can't stay in the rpm database: EL5's needs mkinitrd, EL6's /sbin/new-kernel-pkg, and dnf won't
# remove the running one. So before the transaction its records go (its files stay: the running kernel and its boot
# entry are the fallback), and the files of kernels no package owns and that aren't running go too, so the release's
# kernel fits (CentOS 5's /boot is 200 MB). After it the release's own kernel is installed, and GRUB legacy, which can't read EL8+'s BLS
# entries and which GRUB2 can't replace on a sector-63 disk, gets an entry for the new kernel as its default. Only
# vmlinuz entries are touched (memtest, Xen and chainloader entries stay). Nothing is removed unless the machine is
# booted from this root: in a chroot of someone's disk, uname -r is the host's kernel, not the box's.
kernel_before = [
  "[ / -ef /proc/1/root ] || { echo \"not booted from this root: kernel records left as they are\"; exit 0; }; K=$(for p in kernel kernel-core kernel-modules kernel-modules-core kernel-modules-extra; do rpm -q $p 2>/dev/null | grep -v 'is not installed'; done); if [ -n \"$K\" ]; then mkdir -p /var/lib/wend && echo $K > /var/lib/wend/kernel-handover && rpm -e --justdb --nodeps --noscripts --notriggers $K && echo \"kernel records dropped, files kept: $K\"; fi",
  "[ / -ef /proc/1/root ] || { echo \"not booted from this root: the running kernel isn't its own, nothing removed\"; exit 0; }; R=$(uname -r); G=/boot/grub/grub.conf; D=\"\"; [ -f $G ] && D=$(awk -F= '/^default=/ {d = $2} /^title/ {t++} t - 1 == d && $0 ~ /vmlinuz-/ {sub(/.*vmlinuz-/, \"\"); sub(/[ \\t].*/, \"\"); print; exit}' $G); for f in /boot/vmlinuz-*; do [ -e \"$f\" ] || continue; v=${f#/boot/vmlinuz-}; [ -n \"$v\" ] || continue; case \"$v\" in 0-rescue-*|\"$R\"|\"$D\") continue;; esac; rpm -qf \"$f\" >/dev/null 2>&1 && continue; echo \"removing an old kernel no package owns: $v\"; rm -f \"/boot/vmlinuz-$v\" \"/boot/.vmlinuz-$v.hmac\" \"/boot/System.map-$v\" \"/boot/config-$v\" \"/boot/symvers-$v.gz\" \"/boot/initrd-$v.img\" \"/boot/initramfs-$v.img\" \"/etc/ld.so.conf.d/kernel-$v.conf\"; rm -rf \"/lib/modules/$v\"; done; df -h /boot | tail -n1",
]
kernel_after = [
  "[ / -ef /proc/1/root ] || exit 0; [ -e /var/lib/wend/kernel-handover ] || exit 0; {clean_repos}; rm -f /var/lib/rpm/__db.*; rpm --rebuilddb; if command -v dnf >/dev/null 2>&1; then dnf -y {dnf_opts} install kernel; else yum -y install kernel; fi && rpm -q kernel && rm -f /var/lib/wend/kernel-handover",
  "[ / -ef /proc/1/root ] || exit 0; G=/boot/grub/grub.conf; [ -f $G ] || exit 0; V=$(rpm -q --qf '%{INSTALLTIME} %{VERSION}-%{RELEASE}.%{ARCH}\\n' kernel-core kernel 2>/dev/null | grep -v 'is not installed' | sort -n | tail -n1 | cut -d' ' -f2); [ -n \"$V\" ] || exit 0; [ -f \"/boot/vmlinuz-$V\" ] || V=${V%.*}; [ -f \"/boot/vmlinuz-$V\" ] || { echo \"no /boot/vmlinuz for the installed kernel $V\"; exit 1; }; if ! grep -q \"vmlinuz-$V[[:space:]]\" $G; then E=$(awk -F= '/^default=/ {d = $2} /^title/ {t++} $1 ~ /^[ \\t]*kernel / && $0 ~ /vmlinuz-/ {if (!f) f = $0; if (t - 1 == d) {print; x = 1; exit}} END {if (!x) print f}' $G | sed 's/^[ \\t]*//'); P=$(echo \"$E\" | awk '{sub(/vmlinuz-.*/, \"\", $2); print $2}'); A=$(echo \"$E\" | awk '{for (i = 3; i <= NF; i++) printf \"%s \", $i}'); R=$(awk -F= '/^default=/ {d = $2} /^title/ {t++; r = \"\"} $1 ~ /^[ \\t]*root[ \\t]/ {r = $0} $1 ~ /^[ \\t]*kernel / && $0 ~ /vmlinuz-/ {if (!f) {f = 1; q = r} if (t - 1 == d) {print r; x = 1; exit}} END {if (!x) print q}' $G | sed 's/^[ \\t]*//'); [ -n \"$E\" ] && [ -n \"$R\" ] || { echo \"no kernel entry in $G to copy the root and arguments from\"; exit 1; }; I=initramfs-$V.img; [ -f \"/boot/$I\" ] || I=initrd-$V.img; awk -v v=\"$V\" -v p=\"$P\" -v a=\"$A\" -v r=\"$R\" -v i=\"$I\" 'BEGIN {d = 0} /^title/ && !d {print \"title \" v; print \"\\t\" r; print \"\\tkernel \" p \"vmlinuz-\" v \" \" a; print \"\\tinitrd \" p i; d = 1} {print}' $G > $G.wend && cat $G.wend > $G && rm -f $G.wend || exit 1; fi; awk 'function flush() {if (n && keep) printf \"%s\", b; b = \"\"; n = 0; keep = 1} /^title/ {flush(); n = 1} n && $1 == \"kernel\" && $2 ~ /vmlinuz-/ {f = $2; sub(/.*vmlinuz-/, \"/boot/vmlinuz-\", f); if (system(\"test -e \" f) != 0) keep = 0} n {b = b $0 \"\\n\"; next} {print} END {flush()}' $G > $G.wend && cat $G.wend > $G && rm -f $G.wend || exit 1; D=$(awk -v v=\"vmlinuz-$V\" '/^title/ {t++} $1 == \"kernel\" && index($2, v) {print t - 1; exit}' $G); [ -n \"$D\" ] || { echo \"no entry for $V in $G\"; exit 1; }; awk -v d=\"$D\" '/^default=/ {print \"default=\" d; next} {print}' $G > $G.wend && cat $G.wend > $G && rm -f $G.wend || exit 1; grep -E '^(default|title)' $G",
]


# Relocate (SPEC "Relocate", docs/rebuild-and-carry.md): copy the running root onto a fresh XFS v5 filesystem on a disk
# the owner names, point the boot at the copy for one trial boot, keep the old root untouched as the rollback. For
# CentOS 7 boxes whose / and /boot are XFS v4, which EL10's kernel can't mount. Harness steps, not fix steps: fixes
# can't reach any of this. tools/vm.py runs preflight, refresh, place, copy, fixup, flip and release in that order
# inside the booted machine, one script per list item, stopping at the first that fails, then cleanup whatever
# happened. {new_disk} is the disk the owner named, {route_mib} the room the route's hops need on top of the copy.
# Facts the later steps and boots need go to /var/lib/wend/relocate.env, which the copy carries. BIOS and GRUB 2 only.
[relocate]
preflight = ['''
set -e
fail() { echo "relocate refused: $*"; exit 1; }
D={new_disk}
[ ! -d /sys/firmware/efi ] || fail "UEFI isn't built yet (BIOS only)"
command -v grub2-install >/dev/null && [ -d /usr/lib/grub/i386-pc ] || fail "no GRUB 2 for BIOS (grub2-pc)"
command -v rsync >/dev/null || fail "rsync isn't installed"
mountpoint -q /boot || fail "/boot isn't a filesystem of its own"
BOOT_DEV=$(findmnt -no SOURCE /boot)
[ "$(lsblk -no TYPE "$BOOT_DEV" | head -n1)" = part ] || fail "/boot ($BOOT_DEV) isn't a plain partition"
BOOT_DISK=/dev/$(lsblk -no PKNAME "$BOOT_DEV" | head -n1)
case "$BOOT_DISK" in /dev/|/dev/md*) fail "/boot isn't on a plain disk ($BOOT_DISK)";; esac
[ -f /boot/grub2/grub.cfg ] && [ -f /boot/grub2/grubenv ] && [ ! -L /boot/grub2/grubenv ] || fail "no GRUB 2 config and grubenv in /boot/grub2"
[ ! -e /boot/grub2/grub.cfg.wend-old ] || fail "a relocate stub is already in /boot/grub2"
ROOT_DEV=$(findmnt -no SOURCE /)
set -- $(lvs --noheadings -o vg_name,lv_name "$ROOT_DEV" 2>/dev/null)
[ $# = 2 ] || fail "/ ($ROOT_DEV) isn't on LVM"
VG=$1 OLD_LV=$2
! lvs "$VG/wend-root" >/dev/null 2>&1 || fail "$VG/wend-root exists already"
! lsblk -rno TYPE | grep -qx crypt || fail "LUKS isn't handled"
M=$(findmnt -rno TARGET,SOURCE | while read m s; do
  case "$s" in /dev/*) [ "$m" = / ] || [ "$m" = /boot ] || { echo "$m"; break; };; esac
done)
[ -z "$M" ] || fail "$M is mounted from a disk: carrying more than / and /boot isn't built yet, and both roots would share it"
awk '$1 !~ /^#/ && $3 == "xfs" {print $2}' /etc/fstab | while read m; do mountpoint -q "$m" || { echo "$m"; break; }; done | grep -q . && fail "an XFS filesystem in fstab isn't mounted: wend doesn't know what's on it"
[ "$(rpm -q --last kernel | head -n1 | awk '{print $1}')" = "kernel-$(uname -r)" ] || fail "the newest kernel isn't the running one: reboot first"
! pgrep -x yum >/dev/null && [ ! -e /var/run/yum.pid ] || fail "yum is running"
[ -b "$D" ] || fail "$D isn't a block device"
[ "$(lsblk -dno TYPE "$D")" = disk ] && [ "$(lsblk -no NAME "$D" | wc -l)" = 1 ] || fail "$D isn't a whole disk without partitions"
! blkid -p "$D" >/dev/null 2>&1 || fail "$D has a signature on it ($(blkid -p -o value -s TYPE "$D"))"
! grep -q "^$D[ 0-9]" /proc/mounts || fail "$D is mounted"
! pvs "$D" >/dev/null 2>&1 || fail "$D is an LVM PV already"
[ "$(readlink -f "$D")" != "$(readlink -f "$BOOT_DISK")" ] || fail "$D is the boot disk"
NEED=$(( ($(df -Pk / | awk 'NR == 2 {print $3}') + $(df -Pk /boot | awk 'NR == 2 {print $3}')) * 6 / 5 / 1024 + {route_mib} ))
HAVE=$(( $(blockdev --getsize64 "$D") / 1048576 ))
[ "$HAVE" -ge "$NEED" ] || fail "$D has $HAVE MiB; the copy needs $NEED"
mkdir -p /var/lib/wend
printf 'VG=%s\nOLD_LV=%s\nBOOT_DISK=%s\nBOOT_UUID=%s\nNEW_DISK=%s\n' "$VG" "$OLD_LV" "$BOOT_DISK" "$(blkid -s UUID -o value "$BOOT_DEV")" "$D" > /var/lib/wend/relocate.env
echo "relocate: $VG/$OLD_LV -> $VG/wend-root on $D ($HAVE MiB, needs $NEED); boot disk $BOOT_DISK"
''']
# The running release's own grub2-install, with the old /boot/grub2 as its prefix: 7.0 and 7.1's core.img can't read
# XFS v5, and every module under the prefix has to come from the same build as core.img. Before the copy, so the copy
# carries the same modules. The only write to the boot disk's MBR.
refresh = ['''
set -e
. /var/lib/wend/relocate.env
grub2-install --target=i386-pc "$BOOT_DISK"
''']
place = ['''
set -e
. /var/lib/wend/relocate.env
pvcreate -y "$NEW_DISK" && vgextend "$VG" "$NEW_DISK" && lvcreate -y -n wend-root -l 100%PVS "$VG" "$NEW_DISK"
mkfs.xfs -q -m crc=1 -n ftype=1 "/dev/$VG/wend-root" && xfs_db -r -c version "/dev/$VG/wend-root" | grep -q CRC || { echo "the new root isn't XFS v5"; exit 1; }
mkdir -p /run/wend/new && mount "/dev/$VG/wend-root" /run/wend/new
echo "NEW_UUID=$(blkid -s UUID -o value "/dev/$VG/wend-root")" >> /var/lib/wend/relocate.env
''']
# Two passes from a bind mount of / (which shows what mounts hide, and nothing mounted under it): one live, then one
# with every running service stopped except what keeps the machine reachable and safe (sshd, NetworkManager,
# firewalld, auditd, dbus, systemd's own), which stays stopped until the trial boot. The old /boot goes into the
# copy's /boot, which the root pass leaves alone.
copy = ['''
set -e
mkdir -p /run/wend/src && { mountpoint -q /run/wend/src || mount --bind / /run/wend/src; }
rsync -aHAXS --numeric-ids --exclude='/boot/*' /run/wend/src/ /run/wend/new/ && rsync -aHAXS --numeric-ids /boot/ /run/wend/new/boot/
''', '''
set -e
K='^(sshd|NetworkManager|firewalld|auditd|dbus|polkit|systemd-.*|getty@.*|serial-getty@.*|lvm2-.*|dm-event)\.service$'
systemctl list-units --type=service --state=running --no-legend --plain | awk '{print $1}' | grep -Ev "$K" > /var/lib/wend/relocate-stopped || true
for s in $(cat /var/lib/wend/relocate-stopped); do systemctl stop "$s" || exit 1; done
sync
rsync -aHAXS --numeric-ids --delete --exclude='/boot/*' /run/wend/src/ /run/wend/new/ && rsync -aHAXS --numeric-ids --delete /boot/ /run/wend/new/boot/
''']
# In the copy only: fstab names the new root and drops /boot (a directory now); the kernel line activates the new LV
# instead of the old one; every kernel gets an initramfs that isn't host-only (the old ones activate only the old LV),
# a kernel that can't get one is dropped from the copy (unless it's the running one), and grub2-mkconfig writes the
# copy's grub.cfg. The chroot sees this machine's own /dev, /proc and /sys, unmounted again before the step ends:
# the one sandbox exception here, inside the machine being relocated, never a box on a harness host. SELinux labels
# are fixed from outside, offline, last (never /.autorelabel: EL7's relabel reboots, which would end the trial).
fixup = ['''
set -e
. /var/lib/wend/relocate.env
N=/run/wend/new
awk -v u="$NEW_UUID" '$1 !~ /^#/ && $2 == "/" {$1 = "UUID=" u; $3 = "xfs"} $1 !~ /^#/ && $2 == "/boot" {next} {print}' $N/etc/fstab > $N/etc/fstab.wend && cat $N/etc/fstab.wend > $N/etc/fstab && rm -f $N/etc/fstab.wend
awk -v u="UUID=$NEW_UUID" '$1 !~ /^#/ && $2 == "/" && $1 == u {r++} $1 !~ /^#/ && $2 == "/boot" {b++} END {exit !(r == 1 && !b)}' $N/etc/fstab || { echo "the copy's fstab doesn't name the new root alone"; exit 1; }
O=$(printf '%s/%s' "$VG" "$OLD_LV" | sed 's/[.[\*^$]/\\&/g')
sed -i "s#rd\.lvm\.lv=$O\([\" ]\)#rd.lvm.lv=$VG/wend-root\1#" $N/etc/default/grub
! grep -q "rd\.lvm\.lv=$O[\" ]" $N/etc/default/grub || { echo "the copy's kernel line still activates $VG/$OLD_LV"; exit 1; }
''', '''
set -e
. /var/lib/wend/relocate.env
N=/run/wend/new
trap 'umount $N/sys $N/proc $N/dev 2>/dev/null' EXIT
mount --bind /dev $N/dev && mount -t proc proc $N/proc && mount -t sysfs sysfs $N/sys || exit 1
for v in $(ls $N/lib/modules); do
  [ -f "$N/boot/vmlinuz-$v" ] || continue
  chroot $N dracut -f --no-hostonly --add lvm "/boot/initramfs-$v.img" "$v" && continue
  [ "$v" != "$(uname -r)" ] || { echo "the running kernel's initramfs can't be rebuilt in the copy"; exit 1; }
  echo "dropping kernel $v from the copy: no initramfs for it"
  mkdir -p $N/var/lib/wend/relocate-dropped && mv "$N/boot/vmlinuz-$v" $N/var/lib/wend/relocate-dropped/ || exit 1
done
GRUB_DISABLE_OS_PROBER=true chroot $N grub2-mkconfig -o /boot/grub2/grub.cfg || exit 1
grep -q "root=/dev/mapper/$(echo "$VG" | sed 's/-/--/g')-wend--root " $N/boot/grub2/grub.cfg || { echo "the copy's grub.cfg doesn't boot the new root"; exit 1; }
''', '''
set -e
N=/run/wend/new
! awk -v n="$N/" 'index($5, n) == 1' /proc/self/mountinfo | grep -q . || { echo "still mounted inside the copy"; exit 1; }
S=$(sed -n 's/^SELINUX=//p' $N/etc/selinux/config 2>/dev/null || true) T=$(sed -n 's/^SELINUXTYPE=//p' $N/etc/selinux/config 2>/dev/null || true)
[ "$S" = disabled ] || [ -z "$T" ] || setfiles -r $N $N/etc/selinux/$T/contexts/files/file_contexts $N
''']
# The old /boot's grub.cfg becomes a stub (the old config moves beside it as grub.cfg.wend-old): entry 0 is the new
# root, entry 1 the old one. Its own variables in the old /boot's grubenv, never saved_entry or next_entry: wend_next
# is a one-shot boot, cleared before it's taken, else wend_default, and the old root unless that says 0. The old root
# stays the default; arming the trial is the last write; then fsfreeze, because GRUB doesn't replay the XFS log.
flip = ['''
set -e
. /var/lib/wend/relocate.env
B=/boot/grub2
grub2-editenv $B/grubenv set wend_default=1 && grub2-editenv $B/grubenv unset wend_next || exit 1
cat > $B/grub.cfg.wend-stub <<'EOF'
# wend relocate (docs/rebuild-and-carry.md): 0 boots the relocated root, 1 the old one (its config as it was)
set timeout=3
set fallback=1
# the old /boot as GRUB found it: entry 1 goes back to it, even after a failed entry 0 has moved root and prefix
set wend_boot=$root
set wend_prefix=$prefix
export wend_boot wend_prefix
load_env wend_default wend_next
if [ "${wend_next}" = 0 ]; then
  set default=0
  set wend_next=
  save_env wend_next
elif [ "${wend_next}" = 1 ]; then
  set default=1
  set wend_next=
  save_env wend_next
elif [ "${wend_default}" = 0 ]; then
  set default=0
else
  set default=1
fi
menuentry 'wend: relocated root' {
  insmod lvm
  insmod xfs
  search --no-floppy --fs-uuid --set=root NEW_UUID
  set prefix=($root)/boot/grub2
  configfile $prefix/grub.cfg
}
menuentry 'wend rollback: the old root' {
  set root=$wend_boot
  set prefix=$wend_prefix
  configfile /grub2/grub.cfg.wend-old
}
EOF
sed -i "s/NEW_UUID/$NEW_UUID/" $B/grub.cfg.wend-stub && cp -p $B/grub.cfg $B/grub.cfg.wend-old && mv $B/grub.cfg.wend-stub $B/grub.cfg || exit 1
grub2-editenv $B/grubenv set wend_next=0 && touch /var/lib/wend/relocate-flipped && sync && fsfreeze -f /boot && fsfreeze -u /boot
''']
release = ['''
set -e
for m in /run/wend/new /run/wend/src; do ! mountpoint -q $m || umount $m || exit 1; done
! grep -q ' /run/wend/' /proc/self/mounts || { echo "still mounted under /run/wend"; exit 1; }
''']
# whatever happened: nothing left mounted, and the services the copy stopped running again if the flip never happened
cleanup = ['''
for m in /run/wend/new/sys /run/wend/new/proc /run/wend/new/dev /run/wend/new /run/wend/src; do ! mountpoint -q $m || umount $m; done
if [ ! -e /var/lib/wend/relocate-flipped ] && [ -s /var/lib/wend/relocate-stopped ]; then systemctl start $(cat /var/lib/wend/relocate-stopped); fi
''']
# which root is booted: "new" (the relocated one, XFS v5), "old", or what it is instead
booted = '''. /var/lib/wend/relocate.env; L=$(lvs --noheadings -o lv_name "$(findmnt -no SOURCE /)" 2>/dev/null | tr -d ' '); if [ "$L" = wend-root ]; then xfs_info / | grep -q crc=1 && echo new || echo "new, but not XFS v5"; elif [ "$L" = "$OLD_LV" ]; then echo old; else echo "neither: ${L:-$(findmnt -no SOURCE /)}"; fi'''
# while the stub is in charge: from the old root, try the new one once more (arm); from the new root, make it the
# default (commit_trial: the old /boot is mounted, since the copy's fstab doesn't), or boot the old root once
# (rollback_next)
arm = '''grub2-editenv /boot/grub2/grubenv set wend_next=0 && sync && fsfreeze -f /boot && fsfreeze -u /boot'''
commit_trial = '''. /var/lib/wend/relocate.env; O=/run/wend/oldboot; mkdir -p $O && mount "UUID=$BOOT_UUID" $O || exit 1; grub2-editenv $O/grub2/grubenv set wend_default=0 && grub2-editenv $O/grub2/grubenv unset wend_next && sync && fsfreeze -f $O && fsfreeze -u $O; r=$?; umount $O && exit $r'''
rollback_next = '''. /var/lib/wend/relocate.env; O=/run/wend/oldboot; mkdir -p $O && mount "UUID=$BOOT_UUID" $O || exit 1; grub2-editenv $O/grub2/grubenv set wend_next=1 && sync && fsfreeze -f $O && fsfreeze -u $O; r=$?; umount $O && exit $r'''

[predicates]
# "installed" is rpm -q: EL has no removed-but-configured state. Multiple versions (kernels) still count as installed.
installed = "rpm -q {pkg}"
file = "test -f {path}"
file-contains = "grep -qF '{text}' {path}"
# The server's own view: the options the installed server reads from {path} and everything it includes, last one
# winning, comments and spacing already resolved. The groups come from the server itself (mysqld --verbose --help
# lists them: mysqld server mysqld-5.0 on MySQL 5.0; mariadb, mariadbd, galera and the versioned ones on MariaDB), so
# a group only the other server reads never counts. No server binary, no groups: false. Keys match with - and _ alike.
# Without a value, true when the key is set.
mysql-option = '''g=$( (mysqld --verbose --help || /usr/sbin/mysqld --verbose --help || /usr/libexec/mysqld --verbose --help || mariadbd --verbose --help || /usr/sbin/mariadbd --verbose --help || /usr/libexec/mariadbd --verbose --help) 2>/dev/null | sed -n 's/^The following groups are read: //p' | head -n 1); [ -n "$g" ] && my_print_defaults --defaults-file={path} $g 2>/dev/null | awk -v k='--{key}' -v v='{value}' -v any={any} '{ n = $0; sub(/=.*/, "", n); gsub(/_/, "-", n); if (n == k) { f = 1; x = $0; sub(/^[^=]*=?/, "", x) } } END { exit !(f && (any || x == v)) }''''

[box]
# Seed packages for building a root from the release's first repo (tools/sandbox.py build_el); yum installs the rest.
# A seed is a package name or something one provides (CentOS 8's centos-linux-release provides centos-release).
seeds = ["bash", "yum", "centos-release", "rpm", "coreutils", "passwd", "shadow-utils", "vim-minimal", "findutils",
         "grep", "sed", "gzip", "tar"]

[ops."rpm.bootstrap"]
summary = "unpack the next release's rpm/yum stack over / when the old rpm can't install it (EL5 -> EL6: xz payloads, sha256 repodata)"
args = { release = { enum = ["centos6"] } }

[ops."rpm.drop-arch"]
summary = "remove every package built for these architectures (rpm -e --nodeps --noscripts), then check none is left: EL5's i386 multilib copies block EL6's transaction"
args = { arches = { list = "i[3-6]86", min = 1 } }

[ops."rpm.transit"]
summary = "pass through a release the old rpm can't reach (EL7 -> EL8: rich dependencies): run its rpm from a staging dir over everything, distro-sync, reinstall what the sync erased, drop the old release's leftovers from the rpm database"
args = { release = { enum = ["alma8"] }, remove = { pattern = "[A-Za-z0-9][A-Za-z0-9._+-]*" }, reinstall = { list = "[A-Za-z0-9][A-Za-z0-9._+-]*", min = 0 } }

[ops."rpm.swap-release"]
summary = "replace the release package by hand (rpm -e --nodeps old, rpm -i new from the hop's repo): epochs and vendor switches block yum"
args = { remove = { pattern = "[a-z0-9][a-z0-9.+-]*-release" }, install = { pattern = "[a-z0-9][a-z0-9.+-]*-release" } }

[ops."rpm.adopt-rpmnew"]
summary = "where rpm left the packaged config as FILE.rpmnew, use it; the old file is kept under /var/lib/wend/saved"
args = { paths = { paths = "managed" } }

[ops."rpm.set-aside-unowned"]
summary = "move config files no installed package owns (leftovers of removed packages) to /var/lib/wend/saved"
args = { paths = { paths = "managed" } }

[ops."fs.layout"]
summary = "usrmove: /bin, /sbin, /lib, /lib64 become symlinks into /usr (EL7); run: /var/run -> /run, /var/lock -> /run/lock"
args = { layout = { enum = ["usrmove", "run"] } }

[ops."kv.set"]
summary = "set key=value lines in a file without sections (replaces the key's lines, commented ones too, and appends)"
args = { path = { path = "kv" }, values = { table = "[A-Za-z0-9_./:-]+" } }

[ops."kv.unset"]
summary = "delete a key's key=value lines"
args = { path = { path = "kv" }, keys = { list = "[A-Za-z0-9_]+" } }

[ops."mysql.set-password"]
summary = "rehash one account's password with the current scheme, reading the plaintext from the box's /etc/wend/secrets/<secret> (never from the fix)"
args = { user = { pattern = "[A-Za-z0-9_]+" }, secret = { pattern = "[a-z0-9][a-z0-9-]*" } }

[ops."mysql.clean-shutdown"]
summary = "start the database once and stop it with a slow shutdown, so the next major version finds a clean redo log"
args = {}

[ops."mysql.upgrade-data"]
summary = "start the new database server on the old data once, run its upgrade tool, stop it cleanly"
args = {}

[ops."ssh.generate-host-keys"]
summary = "create the host key types this sshd expects (ssh-keygen -A; sshd-keygen does it at boot)"
args = {}

[ops."httpd.drop-missing-modules"]
summary = "comment out every LoadModule whose module httpd can no longer load"
args = {}

[ops."php.mysqli-report-off"]
summary = "PHP 8.1+ throws from mysqli where it used to warn; restore the old default for every script, unless the owner already set an auto_prepend_file"
args = {}

[ops."service.record"]
summary = "write down which services start at boot (SysV: the default runlevel's, before the hop that brings systemd; a systemd box: its enabled service units), before a hop that loses them; the first record is kept"
args = {}

[ops."net.ifcfg-to-keyfile"]
summary = "turn /etc/sysconfig/network-scripts/ifcfg-* into NetworkManager keyfiles (nmcli --offline, mode 0600) and pin each interface's name to its HWADDR (required), before EL10, whose NetworkManager can't read ifcfg; fails, changing nothing, on any setting it doesn't convert"
args = {}

[ops."service.enable"]
summary = "enable a systemd unit at boot if a service it replaces or follows (like) is in the SysV record or is an enabled unit now; never disables"
args = { unit = { pattern = "[A-Za-z0-9][A-Za-z0-9_.-]*" }, like = { list = "[A-Za-z0-9][A-Za-z0-9_.-]*" } }

[checks]
# Universal checks every EL box gets. Boxes add their own roles.
pkgdb = "rpm -qa >/dev/null && test -z \"$(rpm -Va --nofiles --nodigest --noscripts 2>&1)\" && test -z \"$(rpm -qa --qf '%{NAME}.%{ARCH}\\n' | grep -vE '^(gpg-pubkey|kernel)[.-]' | sort | uniq -d)\""
current = "every binary a service runs comes from a package built for the running major release (dist tag el$MAJOR); the box lists the binaries"
services = "no package that ships an init script or unit belongs to a name family the box did not have at the start, unless something installed requires it (EL5/6 rpm has no 'explicitly installed')"

# The keys kv.set and kv.unset may touch, per file. Only files without [sections] take kv.set. Keys that grant access
# (anonymous uploads, skip-grant-tables, ...) never go on this list. vsftpd's seccomp_sandbox and isolate* are here
# because vsftpd 3 can't start inside a chroot with them on; they turn off vsftpd's own hardening, not access control.
[kv."/etc/vsftpd/vsftpd.conf"]
keys = ["listen", "listen_ipv6", "background", "seccomp_sandbox", "isolate", "isolate_network", "tcp_wrappers"]
set = true
[kv."/etc/my.cnf"]
keys = ["old_passwords"]
set = false

[hardware]
# SPEC "Hardware preflight": what a machine needs before a route boots it into each release, checked before the first
# hop touches anything. `boot` is the firmware wend's kernel steps are proven to carry a real machine through (the VM
# tier boots its guests by BIOS); a UEFI machine is refused until a UEFI replay proves it. Per release: `cpu`, the
# release's x86-64 level (its glibc refuses anything lower: "Fatal glibc error: CPU does not support x86-64-v2");
# `ram_mib`, the release's documented minimum (Red Hat's "RHEL technology capabilities and limits"); `disk_mib`, an estimate of the free space on / the hop needs (its downloads and the release's
# growth; walking a copy of the machine first measures the real need); `drivers`, the sha256 of
# adapters/drivers/el/<release>.txt, the PCI disk controllers and network cards the release's kernel drives
# and the filesystems it mounts (tools/hwdata.py builds it from the kernel package itself).
# `boot_mib`, the space the release's kernel takes in /boot: its package's /boot files (vmlinuz, System.map, config,
# symvers; measured) and a host-only initramfs. centos7: measured on the VM tier's centos7-lamp (3.10.0-1160.119.1:
# 28.3 MiB without its kdump image, 17.7 of it the initramfs) plus 3 MiB for an LVM or md root. centos6, alma9 and
# alma10: estimates (a container can't build a host-only initramfs for real hardware; CentOS 6's dracut builds a
# generic one); alma9's package files are 24.1 MiB, alma10's 24.9. alma9's also holds 8 MiB for the rescue image: the
# first kernel a BLS release installs finds no rescue loader entry, so dracut-config-rescue's 51-dracut-rescue.install
# copies its own vmlinuz (14.5 MiB) over an EL7 box's vmlinuz-0-rescue (6.5 MiB) and keeps the EL7 rescue initramfs
# it finds; from then on the entry exists and alma10 adds nothing. `old_kernels = "running"`: hop.kernel_before removes every kernel but the running one
# (and GRUB's default) before the hop installs its own, so the new kernel sits beside one other.
boot = ["bios"]
old_kernels = "running"

[hardware.centos6]
cpu = "x86-64"
ram_mib = 1024
disk_mib = 2048
boot_mib = 30
drivers = "sha256:5d8c4017ddb11282325cd8f6443f39da37cd0c23598ce12c63375cd058431adc"

[hardware.centos7]
cpu = "x86-64"
ram_mib = 1024
disk_mib = 2048
boot_mib = 32
drivers = "sha256:965df193dc31f5ed07b8bf88088d8f88371058bdf99fef77c3dfe74965403335"

[hardware.alma9]
cpu = "x86-64-v2"
ram_mib = 1536
disk_mib = 4096
boot_mib = 78
drivers = "sha256:7f5cd70e88962874ef8a0bb5143f617b54bdd77d874ce0a09e68911a0957eb28"

[hardware.alma10]
cpu = "x86-64-v3"
ram_mib = 2048
disk_mib = 4096
boot_mib = 75
drivers = "sha256:ee56169b981a6b8e0221d535317a4da1dc8c68cf0d035d583821ac622740a382"
note = "AlmaLinux 10 has a separate x86_64_v2 build for older CPUs, but no wend route lands on it yet, so an x86-64-v2 machine stops at alma9"

# SPEC "Runtime preflight": the Python 2 interpreters each release a route boots into ships, by upstream version
# ([] for none). tools/runtimes.py reads them from the release's own index (the components the hop uses); a machine
# whose own programs run on Python 2 is told where it stops shipping before anything is touched.
[runtimes.centos6]
python2 = ["2.6.6"]

[runtimes.centos7]
python2 = ["2.7.5"]

[runtimes.alma9]
python2 = []

[runtimes.alma10]
python2 = []
