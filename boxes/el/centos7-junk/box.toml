# CI fixture: a CentOS 7 server nobody planned, the way inherited ones actually look. EPEL, plus nginx from nginx.org's
# own repo in front of everything; Tomcat 8.5 from Apache's tarball serving a JSP, on the distro's Java 8; Redis built
# from source into /usr/local with the SysV init script its installer writes; a Python 2 link shortener (bottle and
# redis-py from pip, into the system Python) talking to that Redis over its socket; root's and a user's crontabs.
# Every download is pinned by sha256 here, so the build refuses anything else. Box files are trusted test code: humans
# review them, clients never run them.
schema = "wend.box/0"
family = "el"
release = "centos7"
arch = "x86_64"
summary = "CentOS 7.9 junk drawer: nginx 1.26 from nginx.org proxying Tomcat 8.5 (tarball in /opt, Java 8, own systemd unit) and a Python 2.7 bottle app (pip-installed bottle and redis-py, own unit and user) backed by Redis 4.0 built from source into /usr/local with a SysV init script; EPEL, root and user crontabs, NetworkManager with a static ifcfg, sshd on 2222, postfix, cron"
packages = ["openssh-server", "openssh-clients", "postfix", "cronie", "crontabs", "sudo", "perl", "curl", "rsync",
            "python", "python-setuptools", "java-1.8.0-openjdk-headless", "gcc", "make", "tar", "gzip", "which",
            "NetworkManager", "initscripts", "procps-ng", "chkconfig"]
customize = '''
set -e
grep -q localhost /etc/hosts 2>/dev/null || printf '127.0.0.1 localhost localhost.localdomain\n' >> /etc/hosts
S=http://127.0.0.1:8085
# everything that doesn't come from CentOS, fetched through the harness's mirror shim and checked against its sha256
get() { curl -sSf -o "/tmp/$(basename $1)" "$S/$1"; echo "$2  /tmp/$(basename $1)" | sha256sum -c --quiet -; }
# EPEL the way most boxes got it (yum install epel-release, from CentOS extras); the hops replace every repo file
cat > /etc/yum.repos.d/box-build.repo <<'EOF'
[box-extras]
name=box-extras
baseurl=http://127.0.0.1:8085/vault.centos.org/7.9.2009/extras/x86_64/
gpgcheck=0
EOF
Y="yum -y --disablerepo=* --enablerepo=centos7-*,box-*"
$Y install epel-release
rm -f /etc/yum.repos.d/box-build.repo
rpm -q epel-release
# pip from EPEL, and nginx from nginx.org: the repo file the owner wrote by hand, as nginx.org's instructions say
get archives.fedoraproject.org/pub/archive/epel/7/x86_64/Packages/p/python2-pip-8.1.2-14.el7.noarch.rpm 129bb387cfa010974ed17e3b9a89bf83d71fd108b0a87c222f6f3124a6ca4594
get nginx.org/packages/centos/7/x86_64/RPMS/nginx-1.26.1-2.el7.ngx.x86_64.rpm cd8b5fdf612564b0984066a6e81a5a9d242b9110fa4d1e2af078d2447ee78a99
$Y install /tmp/python2-pip-8.1.2-14.el7.noarch.rpm /tmp/nginx-1.26.1-2.el7.ngx.x86_64.rpm
rpm -q python2-pip nginx
cat > /etc/yum.repos.d/nginx.repo <<'EOF'
[nginx-stable]
name=nginx stable repo
baseurl=http://nginx.org/packages/centos/$releasever/$basearch/
gpgcheck=1
enabled=1
gpgkey=https://nginx.org/keys/nginx_signing.key
module_hotfixes=true
EOF
# the shortener's libraries, from PyPI into the system Python 2.7 (what every EL7 how-to said to do)
get files.pythonhosted.org/packages/fd/04/1c09ab851a52fe6bc063fd0df758504edede5cc741bd2e807bf434a09215/bottle-0.12.25.tar.gz e1a9c94970ae6d710b3fb4526294dfeb86f2cb4a81eff3a4b98dc40fb0e5e021
get files.pythonhosted.org/packages/a7/7c/24fb0511df653cf1a5d938d8f5d19802a88cef255706fdda242ff97e91b7/redis-3.5.3-py2.py3-none-any.whl 432b788c4530cfe16d8d943a09d40ca6c16149727e4afe8c2c9d5580c59d9f24
pip install --no-index --no-deps /tmp/bottle-0.12.25.tar.gz /tmp/redis-3.5.3-py2.py3-none-any.whl >/tmp/pip.log 2>&1 || { tail -n 20 /tmp/pip.log; exit 1; }
python -c 'import bottle, redis; print bottle.__version__, redis.__version__'
# Redis from source into /usr/local, set up by its own install_server.sh (a SysV script, chkconfig on), then a socket
get download.redis.io/releases/redis-4.0.14.tar.gz 1e1e18420a86cfb285933123b04a82e1ebda20bfb0a289472745a087587e93a7
mkdir -p /usr/local/src && tar xzf /tmp/redis-4.0.14.tar.gz -C /usr/local/src
make -C /usr/local/src/redis-4.0.14 -j4 >/tmp/redis-build.log 2>&1 || { tail -n 20 /tmp/redis-build.log; exit 1; }
make -C /usr/local/src/redis-4.0.14 install PREFIX=/usr/local >/dev/null
(cd /usr/local/src/redis-4.0.14/utils && REDIS_PORT=6379 REDIS_CONFIG_FILE=/etc/redis/6379.conf \
  REDIS_LOG_FILE=/var/log/redis_6379.log REDIS_DATA_DIR=/var/lib/redis REDIS_EXECUTABLE=/usr/local/bin/redis-server \
  ./install_server.sh </dev/null >/tmp/redis-install.log 2>&1) || { tail -n 20 /tmp/redis-install.log; exit 1; }
/etc/init.d/redis_6379 stop >/dev/null
printf 'unixsocket /var/lib/redis/redis.sock\nunixsocketperm 777\n' >> /etc/redis/6379.conf
ls /etc/rc.d/rc3.d/S*redis_6379
rm -f /var/run/redis_6379.pid; /etc/init.d/redis_6379 start
i=0; while [ $i -lt 30 ] && [ ! -S /var/lib/redis/redis.sock ]; do sleep 1; i=$((i+1)); done
/usr/local/bin/redis-cli -s /var/lib/redis/redis.sock set link:wend https://example.org/from-2016
/etc/init.d/redis_6379 stop
test -s /var/lib/redis/dump.rdb
# Tomcat from Apache's tarball, its own user and a unit the owner wrote, and the app it serves
get archive.apache.org/dist/tomcat/tomcat-8/v8.5.100/bin/apache-tomcat-8.5.100.tar.gz 163abe51289dd09dc375791888d6f2d5508c06050548dc4fc7700251f4bebaca
# fixed ids below the range useradd hands out (999 down), as el/centos7-pyapp explains: the shelter needs them
groupadd -r -g 601 tomcat
useradd -r -u 601 -g tomcat -d /opt/tomcat -s /sbin/nologin tomcat
tar xzf /tmp/apache-tomcat-8.5.100.tar.gz -C /opt
ln -s /opt/apache-tomcat-8.5.100 /opt/tomcat
mkdir -p /opt/tomcat/webapps/inventory /var/lib/inventory
echo 'rack 12 spare disks' > /var/lib/inventory/stock.txt
cat > /opt/tomcat/webapps/inventory/index.jsp <<'EOF'
<%@ page import="java.nio.file.*" %><% String s = new String(Files.readAllBytes(Paths.get("/var/lib/inventory/stock.txt")), "UTF-8").trim(); %>inventory: <%= s.toUpperCase() %>
EOF
chown -R tomcat:tomcat /opt/apache-tomcat-8.5.100
cat > /etc/systemd/system/tomcat.service <<'EOF'
[Unit]
Description=Tomcat (the inventory app)
After=network.target

[Service]
User=tomcat
Environment=JAVA_HOME=/usr/lib/jvm/jre
ExecStart=/opt/tomcat/bin/catalina.sh run
SuccessExitStatus=143

[Install]
WantedBy=multi-user.target
EOF
# the shortener: its own user, code under /opt, data under /var/lib, a unit of its own
groupadd -r -g 602 shortener
useradd -r -u 602 -g shortener -d /var/lib/shortener -s /sbin/nologin shortener
mkdir -p /opt/shortener /var/lib/shortener
cat > /opt/shortener/app.py <<'EOF'
#!/usr/bin/python
# shortener: the link shortener marketing wanted in 2016. Python 2, with bottle and redis-py from pip; never ported.
import time

import bottle
import redis

LOG = "/var/lib/shortener/access.log"
r = redis.StrictRedis(unix_socket_path="/var/lib/redis/redis.sock")


@bottle.route("/<code>")
def go(code):
    url = r.get("link:" + code)
    if url is None:
        bottle.abort(404, "no such link")
    hits = r.incr("hits:" + code)
    log = open(LOG, "a")
    log.write("%d %s %d\n" % (time.time(), code, hits))
    log.close()
    return {"code": code, "url": url, "hits": hits}


if __name__ == "__main__":
    print "shortener listening on 127.0.0.1:8081"
    bottle.run(host="127.0.0.1", port=8081, quiet=True)
EOF
chmod 755 /opt/shortener/app.py
chown shortener:shortener /var/lib/shortener
cat > /etc/systemd/system/shortener.service <<'EOF'
[Unit]
Description=link shortener
After=network.target redis_6379.service

[Service]
User=shortener
ExecStart=/usr/bin/python /opt/shortener/app.py
Restart=on-failure

[Install]
WantedBy=multi-user.target
EOF
# nginx in front: the owner's own server block in place of the packaged default.conf
mkdir -p /srv/www
echo '<h1>oldbox junk drawer</h1>' > /srv/www/index.html
cat > /etc/nginx/conf.d/default.conf <<'EOF'
server {
    listen 80 default_server;
    server_name oldbox.example.org;
    root /srv/www;
    location /inventory/ { proxy_pass http://127.0.0.1:8080; }
    location /go/ { proxy_pass http://127.0.0.1:8081/; }
    location = /nginx_status { stub_status; allow 127.0.0.1; deny all; }
}
EOF
nginx -t
# cron: root's nightly backup script, and a user's sweep of old uploads
mkdir -p /var/backups /usr/local/bin
cat > /usr/local/bin/backup-inventory.sh <<'EOF'
#!/bin/sh
# nightly: keep a dated copy of the inventory
tar czf /var/backups/inventory-$(date +%F).tgz -C /var/lib inventory
EOF
chmod 755 /usr/local/bin/backup-inventory.sh
echo '15 3 * * * /usr/local/bin/backup-inventory.sh' | crontab -u root -
useradd -m -s /bin/bash deploy
mkdir -p /home/deploy/bin /home/deploy/uploads
cat > /home/deploy/bin/sweep.sh <<'EOF'
#!/bin/sh
# drop uploads nobody touched in a week
find /home/deploy/uploads -type f -mtime +7 -delete
touch /home/deploy/.last-sweep
EOF
chmod 755 /home/deploy/bin/sweep.sh
chown -R deploy:deploy /home/deploy
echo '*/10 * * * * /home/deploy/bin/sweep.sh' | crontab -u deploy -
for t in rsa ecdsa ed25519; do ssh-keygen -q -t $t -N '' -f /etc/ssh/ssh_host_${t}_key; done
sed -i 's/^#\?Port 22$/Port 2222/' /etc/ssh/sshd_config
grep -q '^Port 2222' /etc/ssh/sshd_config
postconf -e myhostname=oldbox.example.org
systemctl enable sshd postfix crond NetworkManager nginx tomcat shortener
rm -f /tmp/*.rpm /tmp/*.tar.gz /tmp/*.whl
yum clean all >/dev/null
# the static address and MAC pin anaconda writes for a static install (QEMU's default MAC)
mkdir -p /etc/sysconfig/network-scripts
[ -f /etc/sysconfig/network-scripts/ifcfg-eth0 ] || printf 'TYPE=Ethernet\nDEVICE=eth0\nNAME=eth0\nHWADDR=52:54:00:12:34:56\nBOOTPROTO=none\nIPADDR=10.0.2.20\nPREFIX=24\nGATEWAY=10.0.2.2\nDNS1=10.0.2.3\nONBOOT=yes\n' > /etc/sysconfig/network-scripts/ifcfg-eth0
'''
# The services role flags service packages whose family wasn't on the box at the start (see el/centos5-web).
start_hook = "rpm -qa --qf '%{NAME}\\n' | sed -e 's/[0-9.]*//g' -e 's/-.*//' -e 's/^cronie$/vixie/' -e 's/^openssh$/openssh/' | sort -u > /var/lib/wend-expected-families"
isolate = ["nginx", "redis", "tomcat", "app"]

# The owner's confirmed plan for the shortener (SPEC "Sheltering an app"). Its pip-installed bottle and redis-py are
# no package's files: the shelter carries them.
[shelter.shortener]
code = "/opt/shortener"
data = ["/var/lib/shortener"]
user = "shortener"
unit = "shortener.service"
sockets = ["/var/lib/redis/redis.sock"]
ports = ["127.0.0.1:8081"]

[roles]
# what starts at boot: the packaged units, the owner's two (or the shelter's in the shortener's place), and Redis's
# SysV script, which systemd runs through its rc links
boot = '''for u in sshd postfix crond nginx tomcat; do [ "$(systemctl is-enabled $u 2>/dev/null)" = enabled ] || { echo "$u does not start at boot"; exit 1; }; done; for u in shortener wend-shelter-shortener; do [ "$(systemctl is-enabled $u 2>/dev/null)" = enabled ] && break; [ $u = shortener ] || { echo 'nothing starts the shortener at boot'; exit 1; }; done; [ -x /etc/rc.d/init.d/redis_6379 ] && ls /etc/rc.d/rc3.d/S*redis_6379 >/dev/null 2>&1 || { echo "redis_6379's SysV script or its runlevel 3 link is gone"; exit 1; }'''
ssh = "mkdir -p /var/run/sshd /run/sshd; /usr/sbin/sshd -t && grep -q '^Port 2222' /etc/ssh/sshd_config"
mail = "postfix check && test \"$(postconf -h myhostname)\" = oldbox.example.org"
# nginx with the owner's server block: the config parses, it is the one in effect, and it serves the page and status
nginx = '''nginx -t >/tmp/ngx.log 2>&1 && nginx -T 2>/dev/null | grep -q 'server_name oldbox.example.org' || { echo "nginx's config fails, or the owner's server block isn't in it"; cat /tmp/ngx.log; exit 1; }; mkdir -p /var/cache/nginx /var/log/nginx; rm -f /var/run/nginx.pid; nginx; i=0; while [ $i -lt 20 ] && ! curl -s http://127.0.0.1/ >/dev/null; do sleep 1; i=$((i+1)); done; curl -s http://127.0.0.1/ | grep -q 'oldbox junk drawer' && curl -s http://127.0.0.1/nginx_status | grep -q 'Active connections'; rc=$?; nginx -s quit; i=0; while [ $i -lt 20 ] && pgrep -x nginx >/dev/null; do sleep 1; i=$((i+1)); done; [ $rc = 0 ] || { curl -s http://127.0.0.1/ | head -c 300; tail -n 5 /var/log/nginx/error.log; }; exit $rc'''
# Redis as its SysV script starts it, with the row the owner put there
redis = '''rm -f /var/run/redis_6379.pid /var/lib/redis/redis.sock; /etc/rc.d/init.d/redis_6379 start >/tmp/redis.log 2>&1; i=0; while [ $i -lt 30 ] && [ ! -S /var/lib/redis/redis.sock ]; do sleep 1; i=$((i+1)); done; /usr/local/bin/redis-cli -s /var/lib/redis/redis.sock get link:wend | grep -x 'https://example.org/from-2016'; rc=$?; /etc/rc.d/init.d/redis_6379 stop >/dev/null 2>&1; [ $rc = 0 ] || tail -n 8 /var/log/redis_6379.log /tmp/redis.log; exit $rc'''
# Tomcat as the owner's unit starts it (ExecStart, User=, Environment=), compiling and serving the JSP
tomcat = '''F=/etc/systemd/system/tomcat.service; X=$(sed -n 's/^ExecStart=//p' $F | head -n1); U=$(sed -n 's/^User=//p' $F | head -n1); E=$(sed -n 's/^Environment=//p' $F | head -n1); rm -f /tmp/tc.pid /tmp/tc.out; (sh -c 'echo $$ > /tmp/tc.pid; exec setsid runuser -u "$1" -- env $2 $3' x "$U" "$E" "$X" >/tmp/tc.log 2>&1 &); i=0; while [ $i -lt 120 ] && ! curl -sf http://127.0.0.1:8080/inventory/ >/tmp/tc.out 2>/dev/null; do sleep 1; i=$((i+1)); done; grep 'inventory: RACK 12 SPARE DISKS' /tmp/tc.out; rc=$?; kill -TERM -- -$(cat /tmp/tc.pid) 2>/dev/null; i=0; while [ $i -lt 30 ] && kill -0 $(cat /tmp/tc.pid) 2>/dev/null; do sleep 1; i=$((i+1)); done; [ $rc = 0 ] || { echo "ran as $U with $E: $X"; head -c 300 /tmp/tc.out; tail -n 15 /tmp/tc.log; }; exit $rc'''
# The shortener through nginx, with Redis up: whatever the box has enabled for it (its own unit, or the shelter's),
# started from the unit's own ExecStart and User= the way systemd would; the socket proxy a shelter unit needs is
# started from its units too (no systemd in a chroot, and no user namespace: el/centos7-pyapp's app role explains).
# Then the link over HTTP, and the hit in the app's own log.
app = '''rm -f /var/run/redis_6379.pid /var/lib/redis/redis.sock; /etc/rc.d/init.d/redis_6379 start >/tmp/redis.log 2>&1; i=0; while [ $i -lt 30 ] && [ ! -S /var/lib/redis/redis.sock ]; do sleep 1; i=$((i+1)); done; S=; for u in shortener wend-shelter-shortener; do [ "$(systemctl is-enabled $u.service 2>/dev/null)" = enabled ] && S=$u && break; done; [ -n "$S" ] || { echo 'no unit for the shortener is enabled'; exit 1; }; F=/etc/systemd/system/$S.service; X=$(sed -n 's/^ExecStart=//p' $F | head -n1); U=$(sed -n 's/^User=//p' $F | head -n1); rm -f /tmp/app.pid /tmp/proxy.*.pid; n=0; for k in $(ls /etc/systemd/system/$S-*.socket 2>/dev/null); do L=$(sed -n 's/^ListenStream=//p' $k); V=${k%.socket}.service; PU=$(sed -n 's/^User=//p' $V); PX=$(sed -n 's/^ExecStart=//p' $V); PA=$(command -v systemd-socket-activate || echo /usr/lib/systemd/systemd-activate); mkdir -p ${L%/*}; chown $PU ${L%/*} ${L%/*/*}; rm -f $L; n=$((n+1)); (sh -c 'echo $$ > /tmp/proxy.$3.pid; exec setsid runuser -u "$1" -- $2' x "$PU" "$PA -l $L $PX" $n >>/tmp/proxy.log 2>&1 &); done; sleep 1; (sh -c 'echo $$ > /tmp/app.pid; if [ -n "$1" ]; then exec setsid runuser -u "$1" -- $2; else exec setsid $2; fi' x "$U" "$X" >/tmp/app.log 2>&1 &); mkdir -p /var/cache/nginx /var/log/nginx; rm -f /var/run/nginx.pid; nginx; i=0; while [ $i -lt 30 ] && ! curl -sf http://127.0.0.1/go/wend >/dev/null; do sleep 1; i=$((i+1)); done; curl -s http://127.0.0.1/go/wend | tee /tmp/app.out | grep -q '"url": "https://example.org/from-2016"' && H=$(grep -o '"hits": [0-9]*' /tmp/app.out | grep -o '[0-9]*$') && grep -q " wend $H\$" /var/lib/shortener/access.log; rc=$?; nginx -s quit; kill -TERM -- -$(cat /tmp/app.pid) 2>/dev/null; for q in /tmp/proxy.*.pid; do [ -f $q ] && kill -TERM -- -$(cat $q) 2>/dev/null; done; /etc/rc.d/init.d/redis_6379 stop >/dev/null 2>&1; i=0; while [ $i -lt 20 ] && pgrep -x nginx >/dev/null; do sleep 1; i=$((i+1)); done; [ $rc = 0 ] || { echo "ran $S: $X"; head -c 400 /tmp/app.out; tail -n 8 /tmp/app.log /tmp/proxy.log 2>/dev/null; }; exit $rc'''
# root's backup job and deploy's sweep, each run once as its crontab would, and what each did
cron = '''test -x /usr/sbin/crond || { echo 'no crond'; exit 1; }; C=$(crontab -l -u root 2>/dev/null | awk '$6 == "/usr/local/bin/backup-inventory.sh" {print $6}'); [ -n "$C" ] || { echo "root's crontab lost the backup job"; exit 1; }; rm -f /var/backups/inventory-*.tgz; sh -c "$C" && tar tzf /var/backups/inventory-*.tgz | grep -q 'inventory/stock.txt' || { echo 'the backup job made no backup of the inventory'; exit 1; }; D=$(crontab -l -u deploy 2>/dev/null | awk '$6 == "/home/deploy/bin/sweep.sh" {print $6}'); [ -n "$D" ] || { echo "deploy's crontab lost the sweep job"; exit 1; }; rm -f /home/deploy/.last-sweep; runuser -u deploy -- sh -c 'touch -d "30 days ago" /home/deploy/uploads/old.tmp; touch /home/deploy/uploads/new.tmp'; runuser -u deploy -- sh -c "$D" && test -f /home/deploy/.last-sweep && [ ! -e /home/deploy/uploads/old.tmp ] && [ -e /home/deploy/uploads/new.tmp ] || { echo 'the sweep job did not sweep'; exit 1; }'''
current = '''M=$(grep -o '[0-9][0-9]*' /etc/redhat-release | head -n1); for f in /usr/sbin/sshd /usr/sbin/crond /usr/sbin/nginx $(readlink -f /usr/lib/jvm/jre)/bin/java; do p=$(rpm -qf --qf '%{NAME}-%{VERSION}-%{RELEASE}' "$(readlink -f $f)" 2>/dev/null); echo "$p" | grep -qE "[._]el${M}([._]|$)" || { echo "$f comes from '$p', not a release-$M package"; exit 1; }; done'''
network = "M=$(grep -o '[0-9][0-9]*' /etc/redhat-release | head -n1); if [ $M -ge 10 ]; then K=$(grep -lx 'interface-name=eth0' /etc/NetworkManager/system-connections/*.nmconnection 2>/dev/null | head -n1); [ -n \"$K\" ] && [ \"$(stat -c %a \"$K\")\" = 600 ] && awk '/^\\[/ {s = $0} s == \"[ipv4]\" && $0 == \"method=manual\" {m = 1} END {exit !m}' \"$K\" && grep -iqx 'mac-address=52:54:00:12:34:56' \"$K\" && ! grep -qx 'autoconnect=false' \"$K\" && grep -iqx 'MACAddress=52:54:00:12:34:56' /etc/systemd/network/10-wend-eth0.link && grep -qx 'Name=eth0' /etc/systemd/network/10-wend-eth0.link && grep -Eqx 'address1=10\\.0\\.2\\.20/24(,10\\.0\\.2\\.2)?' \"$K\" && grep -Eqx '(address1=10\\.0\\.2\\.20/24,10\\.0\\.2\\.2|gateway=10\\.0\\.2\\.2)' \"$K\" || { echo 'eth0 has no 0600 autoconnecting keyfile for its MAC with the static 10.0.2.20/24 via 10.0.2.2, or no .link pinning eth0 to that MAC'; exit 1; }; else grep -Eqx 'IPADDR=(10\\.0\\.2\\.20|\"10\\.0\\.2\\.20\")' /etc/sysconfig/network-scripts/ifcfg-eth0 || { echo 'ifcfg-eth0 lost the static 10.0.2.20'; exit 1; }; fi"
services = "for p in $(ls /etc/rc.d/init.d/* /usr/lib/systemd/system/*.service 2>/dev/null | xargs rpm -qf --qf '%{NAME}\\n' 2>/dev/null | grep -v 'not owned' | sort -u); do case $p in dbus-daemon|dbus-broker|hostname|readonly-root|netconsole-service|systemd|systemd-udev|systemd-container) continue;; esac; f=$(echo $p | sed -e 's/[0-9.]*//g' -e 's/-.*//' -e 's/^cronie$/vixie/' -e 's/^openssh$/openssh/'); grep -qxs \"$f\" /var/lib/wend-expected-families /var/lib/wend/added-families && continue; for c in $p $(rpm -q --provides $p | awk '{print $1}'); do rpm -q --whatrequires \"$c\" >/dev/null 2>&1 && continue 2; done; echo \"unexpected new service package: $p\"; exit 1; done"

# The VM tier (tools/vm.py): the roles that start daemons are the live checks below, against what the box started at
# boot. app reaches the shortener whichever way the box runs it, through nginx.
[vm]
ssh_port = 2222
root_fs = "xfs"  # the shelter's mounts are idmapped, which the ext3 the VM tier installs by default can't be
skip = ["nginx", "redis", "tomcat", "app"]
# nginx serves /srv/www (default_t, no httpd label) and proxies to 8080 and 8081 without httpd_can_network_connect: the
# owner followed nginx.org's instructions on a permissive box, so under enforcing nginx answers 403 and everything
# behind it is unreachable. The shelter's enforcing window judges the shelter, not that.
permissive_only = ["nginx", "tomcat", "app"]

[vm.live]
daemons = '''for i in $(seq 1 60); do ok=1; for p in master crond sshd nginx redis-server; do pgrep -x $p >/dev/null || ok=0; done; pgrep -u tomcat -x java >/dev/null || ok=0; [ $ok = 1 ] && exit 0; sleep 2; done; for p in master crond sshd nginx redis-server; do pgrep -x $p >/dev/null || echo "$p is not running"; done; pgrep -u tomcat -x java >/dev/null || echo 'Tomcat is not running'; exit 1'''
nginx = '''curl -s http://127.0.0.1/ | grep -q 'oldbox junk drawer' && curl -s http://127.0.0.1/nginx_status | grep -q 'Active connections' || { curl -s http://127.0.0.1/ | head -c 300; systemctl status nginx 2>&1 | tail -n 10; exit 1; }'''
redis = '''/usr/local/bin/redis-cli -s /var/lib/redis/redis.sock get link:wend | grep -x 'https://example.org/from-2016' || { tail -n 8 /var/log/redis_6379.log; systemctl status redis_6379 2>&1 | tail -n 10; exit 1; }'''
tomcat = '''for i in $(seq 1 60); do curl -sf http://127.0.0.1/inventory/ > /tmp/tc.out 2>/dev/null && grep -q 'inventory: RACK 12 SPARE DISKS' /tmp/tc.out && exit 0; sleep 2; done; head -c 300 /tmp/tc.out; systemctl status tomcat 2>&1 | tail -n 15; exit 1'''
app = '''for i in $(seq 1 60); do curl -s http://127.0.0.1/go/wend > /tmp/app.out 2>/dev/null && grep -q '"url": "https://example.org/from-2016"' /tmp/app.out && break; sleep 2; done; H=$(grep -o '"hits": [0-9]*' /tmp/app.out | grep -o '[0-9]*$'); [ -n "$H" ] && grep -q " wend $H\$" /var/lib/shortener/access.log || { echo 'no link over HTTP through nginx, or the hit is not in the app log'; head -c 400 /tmp/app.out; systemctl status shortener wend-shelter-shortener 2>&1 | tail -n 20; exit 1; }'''
