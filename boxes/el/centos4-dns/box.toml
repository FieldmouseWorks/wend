# CI fixture, from dep-lab centos/co.py (CO_BOX=b).
# Box files are trusted test code: humans review them, clients never run them.
schema = "wend.box/0"
family = "el"
release = "centos4"
arch = "x86_64"
summary = "CentOS 4.9 DNS/FTP server: BIND master zone, anonymous vsftpd, postfix, ssh on 2222, cron; no web, PHP or database"
packages = ["bind", "bind-utils", "vsftpd", "openssh-server", "openssh-clients", "postfix", "vixie-cron", "crontabs", "sudo", "perl", "curl", "rsync", "python", "logrotate", "ntp", "which"]
customize = '''
set -e
grep -q localhost /etc/hosts 2>/dev/null || printf '127.0.0.1 localhost localhost.localdomain\n' >> /etc/hosts
cat > /etc/named.conf <<'EOF'
options { directory "/var/named"; listen-on { 127.0.0.1; }; allow-query { any; }; recursion no; };
zone "example.org" { type master; file "example.org.zone"; };
EOF
cat > /var/named/example.org.zone <<'EOF'
$TTL 3600
@   IN SOA ns1.example.org. hostmaster.example.org. ( 2007100901 3600 600 604800 3600 )
    IN NS  ns1.example.org.
ns1 IN A   192.0.2.1
www IN A   192.0.2.10
EOF
chgrp named /etc/named.conf /var/named/example.org.zone
mkdir -p /var/ftp/pub && echo 'ftp from 2007' > /var/ftp/pub/hello.txt
grep -q '^anonymous_enable=YES' /etc/vsftpd/vsftpd.conf
for t in rsa dsa; do ssh-keygen -q -t $t -N '' -f /etc/ssh/ssh_host_${t}_key; done
sed -i 's/^#\?Port 22$/Port 2222/' /etc/ssh/sshd_config
grep -q '^Port 2222' /etc/ssh/sshd_config
postconf -e myhostname=oldbox.example.org
useradd -m -s /bin/bash alice
mkdir -p /home/alice/backup
echo '0 3 * * * /usr/bin/rsync -a /var/ftp/ /home/alice/backup/ # nightly-backup' | crontab -u alice -
# the owner runs these at boot (stock CentOS 4 installs httpd, mysqld, named and vsftpd switched off)
chkconfig named on
chkconfig vsftpd on
yum clean all >/dev/null
# the static address and MAC pin anaconda writes for a static install (QEMU's default MAC) (the VM's kickstart has written its own)
mkdir -p /etc/sysconfig/network-scripts
[ -f /etc/sysconfig/network-scripts/ifcfg-eth0 ] || printf 'DEVICE=eth0\nHWADDR=52:54:00:12:34:56\nBOOTPROTO=static\nIPADDR=10.0.2.20\nNETMASK=255.255.255.0\nGATEWAY=10.0.2.2\nONBOOT=yes\n' > /etc/sysconfig/network-scripts/ifcfg-eth0
'''
# The services role flags service packages whose family wasn't on the box at the start. It skips EL7+'s own
# base-system service packages by exact name (dbus-daemon, dbus-broker, hostname, readonly-root, netconsole-service,
# systemd, systemd-udev, and systemd-container, which EL8 split out of systemd so upgraded boxes keep machinectl). Every
# real EL7+ machine has these; the lab removed some in the chroot, which a real box must not copy. Any other
# systemd-* package, or a stray daemon from a fix (mysql on a DNS box), is still caught.
# A CentOS 4 box also gains EL5's own base services on its first hop: iscsi-initiator-utils (EL5's mkinitrd requires it)
# and mcstrans (EL5's SELinux base). Every real CentOS 5 install has both; later releases stop requiring them.
start_hook = "rpm -qa --qf '%{NAME}\\n' | sed -e 's/[0-9.]*//g' -e 's/-.*//' -e 's/^mariadb$/mysql/' -e 's/^chrony$/ntp/' -e 's/^cronie$/vixie/' -e 's/^openssh$/openssh/' | sort -u > /var/lib/wend-expected-families"
isolate = ["ftp"]

[roles]
# offline, as a chroot allows: SysV runlevel 3 before EL7, systemd unit enablement after (wend#6)
boot = "M=$(grep -o '[0-9][0-9]*' /etc/redhat-release | head -n1); if [ $M -lt 7 ]; then for s in named vsftpd sshd postfix crond; do chkconfig --list $s 2>/dev/null | grep -q '3:on' || { echo \"$s does not start at boot\"; exit 1; }; done; else for u in named vsftpd sshd postfix crond; do [ \"$(systemctl is-enabled $u 2>/dev/null)\" = enabled ] || { echo \"$u does not start at boot\"; exit 1; }; done; fi"
ssh = "mkdir -p /var/run/sshd /run/sshd; /usr/sbin/sshd -t && grep -q '^Port 2222' /etc/ssh/sshd_config"
cron = "test -x /usr/sbin/crond && crontab -l -u alice | grep nightly-backup"
python = "python3 -c 'print(6*7)' | grep 42 || python -c 'print 6*7' | grep 42"
tools = "perl -e 1 && curl -s file:///etc/redhat-release && rsync --version && sudo -V && id alice"
mail = "postfix check && test \"$(postconf -h myhostname)\" = oldbox.example.org"
current = "M=$(grep -o '[0-9][0-9]*' /etc/redhat-release | head -n1); for f in /usr/sbin/named /usr/sbin/vsftpd; do p=$(rpm -qf --qf '%{NAME}-%{VERSION}-%{RELEASE}' \"$(readlink -f $f)\" 2>/dev/null); echo \"$p\" | grep -qE \"[._]el${M}([._]|$)\" || { echo \"$f comes from '$p', not a release-$M package\"; exit 1; }; done"
network = "M=$(grep -o '[0-9][0-9]*' /etc/redhat-release | head -n1); if [ $M -ge 10 ]; then K=$(grep -lx 'interface-name=eth0' /etc/NetworkManager/system-connections/*.nmconnection 2>/dev/null | head -n1); [ -n \"$K\" ] && [ \"$(stat -c %a \"$K\")\" = 600 ] && awk '/^\\[/ {s = $0} s == \"[ipv4]\" && $0 == \"method=manual\" {m = 1} END {exit !m}' \"$K\" && grep -iqx 'mac-address=52:54:00:12:34:56' \"$K\" && ! grep -qx 'autoconnect=false' \"$K\" && grep -iqx 'MACAddress=52:54:00:12:34:56' /etc/systemd/network/10-wend-eth0.link && grep -qx 'Name=eth0' /etc/systemd/network/10-wend-eth0.link && grep -Eqx 'address1=10\\.0\\.2\\.20/24(,10\\.0\\.2\\.2)?' \"$K\" && grep -Eqx '(address1=10\\.0\\.2\\.20/24,10\\.0\\.2\\.2|gateway=10\\.0\\.2\\.2)' \"$K\" || { echo 'eth0 has no 0600 autoconnecting keyfile for its MAC with the static 10.0.2.20/24 via 10.0.2.2, or no .link pinning eth0 to that MAC'; exit 1; }; else grep -qx 'IPADDR=10.0.2.20' /etc/sysconfig/network-scripts/ifcfg-eth0 || { echo 'ifcfg-eth0 lost the static 10.0.2.20'; exit 1; }; fi"
services = "for p in $(ls /etc/rc.d/init.d/* /usr/lib/systemd/system/*.service 2>/dev/null | xargs rpm -qf --qf '%{NAME}\\n' 2>/dev/null | grep -v 'not owned' | sort -u); do case $p in iscsi-initiator-utils|mcstrans|dbus-daemon|dbus-broker|hostname|readonly-root|netconsole-service|systemd|systemd-udev|systemd-container) continue;; esac; f=$(echo $p | sed -e 's/[0-9.]*//g' -e 's/-.*//' -e 's/^mariadb$/mysql/' -e 's/^chrony$/ntp/' -e 's/^cronie$/vixie/' -e 's/^openssh$/openssh/'); grep -qxs \"$f\" /var/lib/wend-expected-families /var/lib/wend/added-families && continue; for c in $p $(rpm -q --provides $p | awk '{print $1}'); do rpm -q --whatrequires \"$c\" >/dev/null 2>&1 && continue 2; done; echo \"unexpected new service package: $p\"; exit 1; done"
dns = "named-checkconf /etc/named.conf && named-checkzone example.org /var/named/example.org.zone"
# vsftpd 3 can't start in the sandbox with its seccomp sandbox and namespace isolation on. The check turns them off
# on its own command line (vsftpd -v writes to fd 0), so no fix has to switch off a real box's hardening.
ftp = "O=''; /usr/sbin/vsftpd -v 0>&1 2>&1 | grep -q 'version [3-9]' && O='-oseccomp_sandbox=NO -oisolate=NO -oisolate_network=NO'; (/usr/sbin/vsftpd /etc/vsftpd/vsftpd.conf $O >/tmp/ftp.log 2>&1 &); i=0; while [ $i -lt 20 ] && ! curl -s ftp://127.0.0.1/pub/hello.txt >/dev/null; do sleep 1; i=$((i+1)); done; curl -sS ftp://127.0.0.1/pub/hello.txt | grep 'ftp from 2007' || { cat /tmp/ftp.log; exit 1; }"

# tools/vm.py: the same box installed in a VM. ftp starts its own vsftpd, which a running box already has; the live
# check asks the running one instead. After every reboot the live checks also ask named for a record and make sure the
# daemons the box runs at boot came up.
[vm]
ssh_port = 2222
skip = ["ftp"]
live = { dns = "for i in $(seq 1 30); do dig @127.0.0.1 www.example.org +short 2>/dev/null | grep -qx 192.0.2.10 && exit 0; sleep 2; done; dig @127.0.0.1 www.example.org; exit 1", daemons = "for i in $(seq 1 30); do ok=1; for p in named vsftpd master crond sshd; do pgrep -x $p >/dev/null || ok=0; done; [ $ok = 1 ] && exit 0; sleep 2; done; for p in named vsftpd master crond sshd; do pgrep -x $p >/dev/null || echo \"$p is not running\"; done; exit 1", ftp = "for i in $(seq 1 30); do curl -s ftp://127.0.0.1/pub/hello.txt | grep -q 'ftp from 2007' && exit 0; sleep 2; done; curl -sS ftp://127.0.0.1/pub/hello.txt; exit 1" }
