# The house rules CI can hold a PR to (its title, Rust by default, timers,
# file size, model names), through burrow's house action, pinned to a commit
# of burrow's main. Each rule is a commit status of its own, `house/RULE (#N)`.
name: house
on:
  pull_request:
    # edited too: the check reads the PR's title and body, so fixing either
    # runs it again.
    types: [opened, edited, reopened, synchronize]
jobs:
  house:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: FieldmouseWorks/burrow/.github/actions/house@4e2a4d8fecf20ee66b14fbdabd1aec207d10fd71 # main
        with:
          # wend's fixes record the model that wrote them (meta.author), and
          # its docs name models to run, so a PR naming one needs no reason.
          model-names: false
          rust-first-allow: |
            tools/** # existing Python reference engine and lab tooling
          file-size-allow: |
            tools/vm.py # existing Python VM runner
            tools/archive.py # existing Python archive tooling
            client/src/hardware.rs # pre-existing large client module
            client/src/upgrade.rs # pre-existing large client module
            client/src/check.rs # pre-existing large client module
            client/src/backend.rs # pre-existing large client module
