# The house rules CI can hold a PR to (its title, Rust by default, timers,
# file size, model names), through burrow's house action, pinned to a commit
# of burrow's main. Each rule is a commit status of its own, `house/RULE (#N)`.
name: house
on:
  pull_request:
    # edited too: the check reads the PR's title and body, so fixing either
    # runs it again.
    types: [opened, edited, reopened, synchronize]
jobs:
  house:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: FieldmouseWorks/burrow/.github/actions/house@5f191d4dbace7102cc7ea862ef9b78919451f17f # main
        with:
          # wend's fixes record the model that wrote them (meta.author), and
          # its docs name models to run, so a PR naming one needs no reason.
          model-names: false
