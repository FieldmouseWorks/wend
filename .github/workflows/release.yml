# Releases: the client a machine's owner downloads. A maintainer pushes a tag (v0.1.0), publishes a release with a new
# tag in GitHub's web UI, or runs this workflow on main with a version; this builds the static binary from that commit, packs it with the atlas it reads (adapters and their driver tables, fixes, routes, runs), checks
# the pack loads and passes its own check, and publishes both files on the tag's release. The asset names carry no
# version, so releases/latest/download/wend-x86_64-linux.tar.gz always names the newest one.
name: release

on:
  push:
    tags: ["v*"]
  # or from main without pushing a tag (a maintainer, or a session that can run workflows but not push tags): the
  # release is made at main's head and gh creates the tag with it
  workflow_dispatch:
    inputs:
      version:
        description: "the new tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write

# one run per version at a time; different versions don't wait on (or cancel) each other
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: the tag to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "dispatch it on main"; exit 1; }
            # bash's =~ matches the whole value, so a version with a newline in it (an extra GITHUB_ENV line) fails
            [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like v0.1.0"; exit 1; }
            # claim the tag now, at the commit this run builds: creating a ref that exists fails, so a second run or a
            # pushed tag can't take the version between this check and the publish
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$VERSION" -f "sha=$GITHUB_SHA" >/dev/null ||
              { echo "tag $VERSION already exists; dispatch a new version"; exit 1; }
            echo "TAG=$VERSION" >> "$GITHUB_ENV"
            echo "CLAIMED=1" >> "$GITHUB_ENV"
          else
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add x86_64-unknown-linux-musl
      - name: static binary
        working-directory: client
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: pack
        run: |
          d=wend-x86_64-linux
          mkdir -p "$d/adapters"
          cp client/target/x86_64-unknown-linux-musl/release/wend "$d/"
          cp adapters/*.toml "$d/adapters/"
          cp -r adapters/drivers "$d/adapters/"
          cp -r fixes routes runs LICENSE-MIT LICENSE-APACHE "$d/"
          cp docs/try-it.md "$d/README.md"
          (cd "$d" && ./wend check)
          tar czf "$d.tar.gz" "$d"
          sha256sum "$d.tar.gz" > SHA256SUMS
          cat SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        # a release made in GitHub's web UI (Releases > Draft a new release, new tag) already exists when this runs:
        # attach the files to it instead of creating it
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # only a pushed tag's run attaches to a release that exists: a dispatched run claimed a new tag, so a
            # release there now is someone else's
            [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || { echo "release $TAG appeared during this run"; exit 1; }
            gh release upload "$TAG" wend-x86_64-linux.tar.gz SHA256SUMS --clobber
          else
            gh release create "$TAG" wend-x86_64-linux.tar.gz SHA256SUMS --verify-tag --title "wend $TAG" \
              --notes "The client and the atlas it reads, built from $GITHUB_SHA. What to run, and what it does and doesn't touch: README.md inside, or docs/try-it.md."
          fi
      - name: give back a claimed tag the run couldn't release
        if: failure() && env.CLAIMED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
