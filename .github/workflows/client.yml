# The Rust client (client/): build it, test it, and hold it to the Python engine byte for byte (client/parity.py).
# Not a required check. It runs on changes to the atlas and the tools too: a spec change the client hasn't caught up
# with (a new op, a changed reference command) turns this red instead of shipping a client that runs something CI
# never proved.
name: client

on:
  pull_request:
    paths: ["client/**", "tools/**", "adapters/**", "fixes/**", "routes/**", "runs/**", ".github/workflows/client.yml"]
  push:
    branches: [main]
    paths: ["client/**", "tools/**", "adapters/**", "fixes/**", "routes/**", "runs/**", ".github/workflows/client.yml"]

permissions:
  contents: read

jobs:
  # the oldest Rust Cargo.toml's rust-version promises, so the promise can't drift while everything else builds on
  # rust-toolchain.toml's pin
  msrv:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$v"
          rustup toolchain install "$v" --profile minimal
          cargo "+$v" build --locked --all-targets
  client:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: static binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: parity with the Python engine
        working-directory: .
        run: python3 -B client/parity.py client/target/x86_64-unknown-linux-musl/release/wend
      - name: the Python engine's umask scoping, by behaviour (runs the PR's own wend, so not in the gate)
        working-directory: .
        run: python3 -B tools/test_umask.py
      - name: the EL GRUB legacy step, by behaviour (runs the PR's own adapter text, so not in the gate)
        working-directory: .
        run: python3 -B tools/test_grub.py
      - name: the Ubuntu old-kernel purge, by behaviour (runs the PR's own adapter text, so not in the gate)
        working-directory: .
        run: python3 -B tools/test_kernels_apt.py
      - name: relocate's preflight, copy fixups and flip, by behaviour, in EL7's bash 4.2 (runs the PR's own adapter text, so not in the gate)
        working-directory: .
        run: |
          sudo apt-get install -y -q grub-common >/dev/null
          curl -sSfL -o "$RUNNER_TEMP/bash-4.2.tar.gz" https://ftp.gnu.org/gnu/bash/bash-4.2.tar.gz
          echo "a27a1179ec9c0830c65c6aa5d7dab60f7ce1a2a608618570f96bfa72e95ab3d8  $RUNNER_TEMP/bash-4.2.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/bash-4.2.tar.gz" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/bash-4.2" && ./configure -q --without-bash-malloc >/dev/null && make -s -j4 >/dev/null 2>&1)
          WEND_EL7_BASH="$RUNNER_TEMP/bash-4.2/bash" python3 -B tools/test_relocate.py
      - name: the harness's printf() and the EL keys it writes, by behaviour in sh, bash and EL7's bash 4.2 (runs the PR's own backends.py, so not in the gate)
        working-directory: .
        run: WEND_EL7_BASH="$RUNNER_TEMP/bash-4.2/bash" python3 -B tools/test_printf.py
      - name: the RPM signature check rpm.transit and rpm.swap-release run, by behaviour on made-up signed RPMs in sh, bash and EL7's bash 4.2 (runs the PR's own backends.py, so not in the gate)
        working-directory: .
        run: WEND_EL7_BASH="$RUNNER_TEMP/bash-4.2/bash" python3 -B tools/test_checksig.py
      - name: the EL op net.ifcfg-to-keyfile, by behaviour (runs the PR's own converter, so not in the gate)
        working-directory: .
        run: python3 -B tools/test_net_ifcfg.py
      - name: the Ubuntu op net.ifupdown-dns-to-resolved, by behaviour (runs the PR's own converter, so not in the gate)
        working-directory: .
        run: python3 -B tools/test_net_ifupdown.py
      - name: the Ubuntu op apt.drop-esm-pins, by behaviour (runs the PR's own step text, so not in the gate)
        working-directory: .
        run: python3 -B tools/test_esm_pins.py
      - name: the leapp-data gap check, by behaviour on made-up events (runs the PR's own tools, so not in the gate)
        working-directory: .
        run: python3 -B tools/test_pesgaps.py
      - name: the mirror shim's download log and store, and the replay's download list, by behaviour (runs the PR's own tools, so not in the gate)
        working-directory: .
        run: python3 -B tools/test_fetched.py
      - name: the archive's store, by behaviour on a made-up repo (runs the PR's own tools, so not in the gate)
        working-directory: .
        run: python3 -B tools/test_archive.py
      - name: the archive's push to R2, by behaviour against a stand-in S3 endpoint (runs the PR's own tools, so not in the gate)
        working-directory: .
        run: python3 -B tools/test_r2push.py
      - name: primary metadata however it's compressed (gz, EPEL 9's xz, EPEL 10's zst), by behaviour (runs the PR's own tools, so not in the gate)
        working-directory: .
        run: WEND_ALL_DECODERS=1 python3 -B tools/test_primary.py
      - name: VM replays side by side (per-guest ports, the install lock, the box cache key), by behaviour with a stand-in QEMU (runs the PR's own vm.py, so not in the gate)
        working-directory: .
        run: python3 -B tools/test_vm_parallel.py
      - name: the atlas passes the client's own check
        working-directory: .
        run: client/target/x86_64-unknown-linux-musl/release/wend check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wend-x86_64-linux-musl
          path: client/target/x86_64-unknown-linux-musl/release/wend
