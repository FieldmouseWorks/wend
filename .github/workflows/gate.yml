# The PR gate. Every job runs the same code an agent runs locally with `./wend verify` (AGENTS.md step 6).
# Exercised on GitHub's stock ubuntu-24.04 runners: both seed replays reach trixie in about 12 minutes.
#
# Trust model: the PR supplies DATA (fixes, routes, boxes). The tools that judge it (check.py, affected.py, the
# replay harness, the compiler) always come from the base branch, so a PR cannot loosen its own checks. A PR that
# edits tools/, adapters/ or SPEC.md is a spec change: CODEOWNERS makes a human review it, and it is judged by
# the base branch's tools like everything else.
name: gate

# Runs on every PR, not only ones touching fixes/routes/boxes: branch protection requires these checks, and a
# filtered-out workflow would leave a required check pending forever. `plan` replays nothing when nothing changed.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    # Every commit in the PR carries a Signed-off-by line (Developer Certificate of Origin).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The PR's own commits, merge commits included, not the synthetic merge commit Actions checks out by default.
      - run: |
          bad=$(git log --format='%H %(trailers:key=Signed-off-by,valueonly,separator=;)' \
                origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }} | awk 'NF<2{print $1}')
          [ -z "$bad" ] || { echo "commits without a DCO sign-off (use git commit -s):"; echo "$bad"; exit 1; }

  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: pr }
      - uses: actions/checkout@v4
        with: { ref: "${{ github.base_ref }}", path: base }
      - name: base branch tools judge the PR's data
        run: |
          rm -rf pr/tools && cp -r base/tools pr/tools
          python3 -B pr/tools/check.py --ids
          python3 -B pr/tools/test_check.py

  plan:
    needs: schema
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { ref: "${{ github.base_ref }}", path: .base }
      - id: m
        run: |
          rm -rf tools && cp -r .base/tools tools && rm -rf .base
          echo "matrix=$(python3 -B tools/affected.py origin/${{ github.base_ref }})" >> "$GITHUB_OUTPUT"

  replay:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.matrix).include[0] }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04          # root via sudo is all a chroot needs; no Docker, no KVM
    timeout-minutes: 150           # dep-lab: 13-15 min per route per box (EL: 10-15), plus building the box
    permissions:
      contents: read
      id-token: write              # for the run attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: "${{ github.base_ref }}", path: .base }
      - run: rm -rf tools prompts wend && cp -r .base/tools .base/prompts .base/wend . && rm -rf .base
      - name: host packages
        run: sudo apt-get update && sudo apt-get install -y debootstrap rsync rpm2cpio cpio iproute2
      # an EL box is ~7GB per copy at EL9/10, and a walk keeps two (the box and its pre-hop snapshot), plus the
      # mirror cache. The stock runner has ~20GB free; toolchains this job never uses give back ~25GB more.
      - name: disk space for EL boxes
        if: ${{ startsWith(matrix.box, 'el/') }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /
      - name: box cache (built boxes are keyed by the box file and the adapter)
        uses: actions/cache@v4
        with:
          path: /var/tmp/wend/boxes
          key: box-${{ matrix.box }}-${{ hashFiles(format('boxes/{0}/box.toml', matrix.box), 'adapters/*.toml') }}
      # the sandbox follows SPEC.md "Sandbox requirements": a per-chroot tmpfs /dev (never a bind of the host's),
      # and it unmounts and verifies before deleting anything.
      - name: replay (no model, no network beyond the release mirrors)
        run: |
          sudo -E python3 -B wend replay "${{ matrix.route }}" "${{ matrix.box }}" --out "$GITHUB_WORKSPACE/run.json"
      # attestations need a public repo (or a paid plan); skipped while the repo is private
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with: { subject-path: run.json }
      - uses: actions/upload-artifact@v4
        with:
          name: run-${{ strategy.job-index }}
          path: run.json

  decoys:
    # Every pinned fix fired on exactly the boxes it claims. A passing replay that touched an unclaimed box fails here.
    # Runs even when replay was skipped (nothing to replay) so it can be a required check; fails if any replay failed.
    needs: [plan, replay]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - if: ${{ needs.plan.result != 'success' || (needs.replay.result != 'success' && needs.replay.result != 'skipped') }}
        run: |
          echo "plan or a replay did not pass: plan=${{ needs.plan.result }} replay=${{ needs.replay.result }}"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: "${{ github.base_ref }}", path: .base }
      - uses: actions/download-artifact@v4
        with: { path: new-runs }
      - run: |
          rm -rf tools && cp -r .base/tools tools && rm -rf .base
          python3 -B tools/file_runs.py new-runs    # files each run.json under runs/<family>/<route>/<box>/
          python3 -B tools/check.py                 # includes the fires_on check over the fresh runs

  claude-review:
    # Asks for the Claude review. Today the verdict is a PR comment from a Claude session; later a commit status
    # named "claude-review" that branch protection requires. Claude merges only after every required check is green
    # and the review has signed off (CONTRIBUTING.md, layer 5). Nobody pushes to main directly.
    needs: decoys
    # !cancelled(): without it GitHub adds success(), which is false whenever replay was skipped (nothing to replay)
    if: ${{ !cancelled() && needs.decoys.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      issues: write
    steps:
      - run: |
          gh label create needs-claude-review -R "$REPO" -c 5319e7 -d "Waiting on the Claude review layer" 2>/dev/null || true
          gh pr edit "$PR" --add-label needs-claude-review -R "$REPO"
        env: { GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}", REPO: "${{ github.repository }}" }

# Not in this file, set in the repo settings by the maintainer (the GitHub proxy Claude sessions use can't):
#   branch protection on main: PRs only, no force pushes or deletion; required checks dco, schema, plan, decoys
#   (decoys fails if any replay failed; matrix replay names vary per route, so they aren't listed one by one);
#   1 approving review from CODEOWNERS. Admins can bypass, because PRs opened by the maintainer's own Claude
#   sessions carry the maintainer's account and GitHub won't let you approve your own PR.
#   Later: require the claude-review commit status once a reviewer sets it.
