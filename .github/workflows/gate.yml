# The PR gate. Every job runs the same code an agent runs locally with `./wend verify` (AGENTS.md step 6).
# Exercised on GitHub's stock ubuntu-24.04 runners: both seed replays reach trixie in about 12 minutes.
#
# Trust model: the PR supplies DATA (fixes, routes, boxes). The tools that judge it (check.py, affected.py, the
# replay harness, the op backends) and the adapters they read (allowlists, argument specs, force flags, the hop
# commands) always come from the base branch, so a PR cannot loosen its own checks or change what runs as root. A
# PR that edits tools/, adapters/ or SPEC.md is a spec change: CODEOWNERS makes a human review it, and it is judged
# by the base branch's tools and adapters like everything else.
name: gate

# Runs on every PR, not only ones touching fixes/routes/boxes: branch protection requires these checks, and a
# filtered-out workflow would leave a required check pending forever. `plan` replays nothing when nothing changed.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    # Every commit in the PR carries a Signed-off-by line (Developer Certificate of Origin).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # The PR's own commits, merge commits included, not the synthetic merge commit Actions checks out by default.
      # Dependabot can't sign off. On a PR GitHub says Dependabot opened (only Dependabot can), an unsigned commit passes
      # only if GitHub itself made it for Dependabot: authored and committed as dependabot[bot] (or committed by GitHub's
      # web-flow), and carrying a signature GitHub verifies. Git's author and committer lines alone can be forged; a
      # verified signature for those identities can't, so a commit anyone else pushes to that PR still needs a sign-off.
      - env:
          GH_TOKEN: "${{ github.token }}"
          REPO: "${{ github.repository }}"
          DEPENDABOT_PR: "${{ github.event.pull_request.user.login == 'dependabot[bot]' }}"
        run: |
          unsigned=$(git log --format='%H %(trailers:key=Signed-off-by,valueonly,separator=;)' \
                     origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }} | awk 'NF<2{print $1}')
          bot='49699333+dependabot[bot]@users.noreply.github.com'
          bad=
          for c in $unsigned; do
            if [ "$DEPENDABOT_PR" = true ] && [ "$(gh api "repos/$REPO/commits/$c" --jq \
                 "(.commit.author.email == \"$bot\") and (.commit.committer.email == \"$bot\" or .commit.committer.email == \"noreply@github.com\") and .commit.verification.verified")" = true ]; then
              continue
            fi
            bad="$bad $c"
          done
          [ -z "$bad" ] || { echo "commits without a DCO sign-off (use git commit -s):"; printf '%s\n' $bad; exit 1; }

  schema:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read           # runs land only from CI, below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: pr }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.base_ref }}", path: base }
      - name: base branch tools judge the PR's data
        run: |
          rm -rf pr/tools pr/adapters && cp -r base/tools base/adapters pr/
          python3 -B pr/tools/check.py --ids
          python3 -B pr/tools/test_check.py
      # A run's pinned sources are what the client trusts (`wend walk --run`), and nobody can review a sha256 by eye.
      # So every run the PR adds or changes must be a gate replay's artifact, byte for byte: the replay job attests
      # each run.json it writes, and tools/file_runs.py files them unchanged. Runs already on the base are left alone.
      - name: runs land only from CI
        env: { GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}" }
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            b="base/${f#pr/}"
            if [ -f "$b" ] && cmp -s "$f" "$b"; then continue; fi
            if ! out=$(gh attestation verify "$f" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/gate.yml" 2>&1); then
              echo "${f#pr/}: not a run CI attested (file CI's artifacts with tools/file_runs.py): $(echo "$out" | tail -n 1)"
              bad=1
            fi
          done < <(find pr/runs -name '*.json' -print0 2>/dev/null)
          exit $bad

  plan:
    needs: schema
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.base_ref }}", path: .base }
      - id: m
        run: |
          rm -rf tools adapters && cp -r .base/tools .base/adapters . && rm -rf .base
          # assigned first: a refusal inside "$(...)" in an echo would leave plan green with an empty matrix
          m=$(python3 -B tools/affected.py origin/${{ github.base_ref }})
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  replay:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.matrix).include[0] }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04          # root via sudo is all a chroot needs; no Docker, no KVM
    timeout-minutes: 150           # dep-lab: 13-15 min per route per box (EL: 10-15), plus building the box
    permissions:
      contents: read
      id-token: write              # for the run attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.base_ref }}", path: .base }
      - run: rm -rf tools adapters prompts wend && cp -r .base/tools .base/adapters .base/prompts .base/wend . && rm -rf .base
      - name: host packages
        run: sudo apt-get update && sudo apt-get install -y debootstrap rsync rpm2cpio cpio iproute2
      # an EL box is ~7GB per copy at EL9/10, and a walk keeps two (the box and its pre-hop snapshot), plus the
      # mirror cache. The stock runner has ~20GB free; toolchains this job never uses give back ~25GB more.
      - name: disk space for EL boxes
        if: ${{ startsWith(matrix.box, 'el/') }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /
      - name: box cache (built boxes are keyed by the box file, the adapter and the base's sandbox, which builds them)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/tmp/wend/boxes
          key: box-${{ matrix.box }}-${{ hashFiles(format('boxes/{0}/box.toml', matrix.box), 'adapters/*.toml', 'tools/sandbox.py') }}
      # the sandbox follows SPEC.md "Sandbox requirements": a per-chroot tmpfs /dev (never a bind of the host's),
      # and it unmounts and verifies before deleting anything.
      - name: replay (no model, no network beyond the release mirrors)
        run: |
          sudo -E python3 -B wend replay "${{ matrix.route }}" "${{ matrix.box }}" --out "$GITHUB_WORKSPACE/run.json"
      # attestations need a public repo (or a paid plan); skipped while the repo is private
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: run.json }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-${{ strategy.job-index }}
          path: run.json
      # docs/archive.md "Capture": what the replay downloaded, with the metadata's bytes, which live repos replace within
      # days. remi ingests it for the runs that land; it's never filed in runs/ and never trusted beyond their pins.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fetched-${{ strategy.job-index }}
          path: run.fetched
          if-no-files-found: ignore
          retention-days: 90

  decoys:
    # Every pinned fix fired on exactly the boxes it claims. A passing replay that touched an unclaimed box fails here.
    # Runs even when replay was skipped (nothing to replay) so it can be a required check; fails if any replay failed.
    needs: [plan, replay]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - if: ${{ needs.plan.result != 'success' || (needs.replay.result != 'success' && needs.replay.result != 'skipped') }}
        run: |
          echo "plan or a replay did not pass: plan=${{ needs.plan.result }} replay=${{ needs.replay.result }}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.base_ref }}", path: .base }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: new-runs, pattern: "run-*" }
      - run: |
          rm -rf tools adapters && cp -r .base/tools .base/adapters . && rm -rf .base
          python3 -B tools/file_runs.py new-runs    # files each run.json under runs/<family>/<route>/<box>/
          python3 -B tools/check.py                 # includes the fires_on check over the fresh runs

  claude-review:
    # Asks for the Claude review. Today the verdict is a PR comment from a Claude session; later a commit status
    # named "claude-review" that branch protection requires. Claude merges only after every required check is green
    # and the review has signed off (CONTRIBUTING.md, layer 6). Nobody pushes to main directly.
    needs: decoys
    # !cancelled(): without it GitHub adds success(), which is false whenever replay was skipped (nothing to replay)
    if: ${{ !cancelled() && needs.decoys.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      issues: write
    steps:
      - run: |
          gh label create needs-claude-review -R "$REPO" -c 5319e7 -d "Waiting on the Claude review layer" 2>/dev/null || true
          gh pr edit "$PR" --add-label needs-claude-review -R "$REPO"
        env: { GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}", REPO: "${{ github.repository }}" }

# Not in this file, set in the repo settings by the maintainer (the GitHub proxy Claude sessions use can't):
#   branch protection on main: PRs only, no force pushes or deletion; required checks dco, schema, plan, decoys,
#   and the remi-proof commit status (remi-proof.yml)
#   (decoys fails if any replay failed; matrix replay names vary per route, so they aren't listed one by one);
#   1 approving review from CODEOWNERS. Admins can bypass, because PRs opened by the maintainer's own Claude
#   sessions carry the maintainer's account and GitHub won't let you approve your own PR.
#   Later: require the claude-review commit status once a reviewer sets it.
