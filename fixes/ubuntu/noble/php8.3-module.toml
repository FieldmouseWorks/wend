# Discovered by agent (claude-code / opus 5.5) on ubuntu/trusty-web.
schema = "wend.fix/0"
family = "ubuntu"
hop = "noble"
when = { installed = "libapache2-mod-php8.1" }
restores = ["box:web", "box:php", "current"]
adds = []

[[post]]
op = "apache.disable"
kind = "mod"
name = "php8.1"

[[post]]
op = "install"
packages = ["php8.3-cli", "libapache2-mod-php8.3"]

[[post]]
op = "apache.enable"
kind = "mod"
name = "php8.3"

[meta]
name = "php8.3-module"
author = "agent (claude-code / opus 5.5)"
found_on = "ubuntu/trusty-web"
fires_on = ["ubuntu/trusty-web"]
reason = "Noble drops PHP 8.1: the dist-upgrade removes its Apache module but leaves it enabled (the .load file is a conffile), so Apache won't start and there is no php. Disable the dead module, install PHP 8.3's CLI and Apache module, and enable it."
