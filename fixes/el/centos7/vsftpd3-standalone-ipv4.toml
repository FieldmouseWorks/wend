# Ported from dep-lab's CentOS fix library: same steps, now typed ops (SPEC.md, Op reference).
schema = "wend.fix/0"
family = "el"
hop = "centos7"
when = { installed = "vsftpd" }
restores = ["box:ftp"]
adds = []

[[post]]
op = "kv.set"
path = "/etc/vsftpd/vsftpd.conf"
values = { listen = "YES", listen_ipv6 = "NO" }

[meta]
name = "vsftpd3-standalone-ipv4"
author = "claude-opus-5-5 medium (dep-lab grow mode, box B)"
curated_by = "claude (wend port to typed ops)"
source = "dep-lab centos/fixes-v3.json: vsftpd3-standalone-ipv4-listen"
note = "Keeps anonymous FTP on: once this file differs from the packaged one, EL8+ keeps it instead of installing its stock vsftpd.conf, whose anonymous_enable=NO would switch off the anonymous FTP this box serves (without this fix the route loses ftp at alma9). The edit itself keeps CentOS 5's listener, standalone on IPv4, instead of EL7's dual-stack listen_ipv6=YES: a choice, not a necessity on a real box."
fires_on = ["el/centos5-dns"]
