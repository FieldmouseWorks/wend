# Ported from dep-lab's CentOS fix library: same steps, now typed ops (SPEC.md, Op reference).
schema = "wend.fix/0"
family = "el"
hop = "centos7"
when = { installed = "centos-release" }
restores = ["services"]
adds = []

[[post]]
op = "remove"
packages = ["portreserve"]
purge = true

[meta]
name = "el7-drop-portreserve"
author = "claude-opus-5-5 medium (dep-lab guided run A)"
curated_by = "claude (wend port to typed ops)"
source = "dep-lab centos/fixes-v3.json: c7-swap-release-distro-sync (svcfix.sh)"
note = "EL6's portreserve has no role on EL7 and nothing on either box uses it; removed if present."
fires_on = ["el/centos5-dns", "el/centos5-web"]
