# Ported from dep-lab's CentOS fix library: same steps, now typed ops (SPEC.md, Op reference).
schema = "wend.fix/0"
family = "el"
hop = "centos7"
when = { all = [{ installed = "centos-release" }, { not = { file = "/etc/sysconfig/iptables" } }, { not = { file = "/etc/sysconfig/ip6tables" } }] }
restores = ["services"]
adds = []

[[post]]
op = "remove"
packages = ["iptables-services"]
purge = true

[meta]
name = "el7-drop-unused-iptables-service"
author = "claude-opus-5-5 medium (dep-lab guided run A)"
curated_by = "claude (wend port to typed ops)"
source = "dep-lab centos/fixes-v3.json: c7-swap-release-distro-sync (svcfix.sh)"
note = "EL7 splits the iptables init script into iptables-services. Only removed when there are no saved rules (/etc/sysconfig/iptables or ip6tables), i.e. the old box ran no firewall; a box with rules keeps the service."
fires_on = ["el/centos4-dns", "el/centos5-dns", "el/centos5-web"]
