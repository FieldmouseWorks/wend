# Carries boot-time service enablement from SysV runlevels onto systemd (issue #6).
schema = "wend.fix/0"
family = "el"
hop = "centos7"
when = { installed = "chkconfig" }
restores = ["box:boot"]
adds = []

[[pre]]
op = "service.record"

[[post]]
op = "service.enable"
unit = "httpd"
like = ["httpd"]

[[post]]
op = "service.enable"
unit = "mariadb"
like = ["mysqld", "mariadb"]

[[post]]
op = "service.enable"
unit = "named"
like = ["named"]

[[post]]
op = "service.enable"
unit = "vsftpd"
like = ["vsftpd"]

[[post]]
op = "service.enable"
unit = "sshd"
like = ["sshd"]

[[post]]
op = "service.enable"
unit = "postfix"
like = ["postfix"]

[[post]]
op = "service.enable"
unit = "crond"
like = ["crond"]

[meta]
name = "el7-carry-boot-services"
author = "claude (wend#6)"
source = "wend#6"
note = "EL7 replaces SysV init with systemd. The old packages remove their runlevel links and the presets leave httpd, mariadb, named and vsftpd disabled. Records what runlevel 3 started on EL6 (the box's own state), then enables each unit whose service started. Units whose service was off stay off."
fires_on = ["el/centos5-dns", "el/centos5-web"]
