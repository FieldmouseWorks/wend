# Ported from dep-lab's CentOS fix library: same steps, now typed ops (SPEC.md, Op reference).
schema = "wend.fix/0"
family = "el"
hop = "centos7"
when = { installed = "httpd" }
restores = ["box:site"]
adds = []

[[post]]
op = "rpm.adopt-rpmnew"
paths = ["/etc/httpd/conf/httpd.conf", "/etc/httpd/conf.d/php.conf"]

[[post]]
op = "httpd.drop-missing-modules"

[meta]
name = "httpd24-config"
author = "claude-opus-5-5 medium (dep-lab guided run A)"
curated_by = "claude (wend port to typed ops)"
source = "dep-lab centos/fixes-v3.json: c7-httpd24-config"
note = "httpd 2.4 can't read a 2.2 httpd.conf, so this takes the packaged httpd.conf and php.conf. The owner's changes to httpd.conf (ServerName, Listen, tuning) are NOT carried over: the old files are under /var/lib/wend/saved, re-apply them in conf.d. Vhosts in conf.d are kept."
fires_on = ["el/centos5-web"]
