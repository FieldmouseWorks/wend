# Carries boot-time service enablement onto systemd (issue #6): php-fpm is new on EL9, and the site needs it wherever httpd runs.
schema = "wend.fix/0"
family = "el"
hop = "alma9"
when = { all = [{ installed = "httpd" }, { installed = "php" }] }
restores = ["box:boot"]
adds = []

[[post]]
op = "service.enable"
unit = "php-fpm"
like = ["httpd"]

[meta]
name = "el9-enable-php-fpm"
author = "claude (wend#6)"
source = "wend#6"
note = "EL9 has no mod_php, so el9-php-fpm-stack installs php-fpm (preset disabled). Enables it at boot wherever httpd starts. Gated like el9-php-fpm-stack: a box with httpd and no PHP has no php-fpm unit."
fires_on = ["el/centos5-web", "el/centos7-lamp", "el/centos8-lamp"]
