# Ported from dep-lab's CentOS fix library: same steps, now typed ops (SPEC.md, Op reference).
schema = "wend.fix/0"
family = "el"
hop = "alma9"
when = { installed = "mariadb-server" }
restores = ["box:db"]
adds = []

[[pre]]
op = "mysql.clean-shutdown"

[meta]
name = "mariadb-slow-shutdown-alma9"
author = "claude-opus-5-5 medium (dep-lab guided run A)"
curated_by = "claude (wend port to typed ops)"
source = "dep-lab centos/fixes-v3.json: a9-mariadb-rehash-and-clean-stop"
note = "Stops MariaDB 5.5 with innodb_fast_shutdown=0 before the hop, so the next major version opens clean data files."
fires_on = ["el/centos5-web", "el/centos7-lamp", "el/centos7-pyapp"]
