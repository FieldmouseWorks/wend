# Hand-written from the discover run on el/centos7-lamp.
schema = "wend.fix/0"
family = "el"
hop = "alma9"
when = { installed = "php-mbstring" }
restores = ["box:php"]
adds = []

[[post]]
op = "install"
packages = ["php-mbstring"]

[meta]
name = "el9-php-mbstring"
author = "claude-code / opus 5.5 (agent, hand-written)"
note = "On EL8 php-mbstring is a module stream package (httpd:2.4 or php:7.2), and the EL8 pass-through of rpm.transit enables no streams, so its distro-sync erases it. Nothing brings it back on EL9; this installs EL9's own."
fires_on = ["el/centos7-lamp"]
