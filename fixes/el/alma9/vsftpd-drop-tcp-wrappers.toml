# Ported from dep-lab's CentOS fix library: same steps, now typed ops (SPEC.md, Op reference).
schema = "wend.fix/0"
family = "el"
hop = "alma9"
# Only where hosts.allow and hosts.deny hold no rules at all (every rule has a colon; the stock files are comments
# without one). Then tcp_wrappers changes nothing and turning it off is exact. Any rule, in any case, is a route gap.
when = { all = [
  { installed = "vsftpd" },
  { not = { file-contains = { path = "/etc/hosts.allow", text = ":" } } },
  { not = { file-contains = { path = "/etc/hosts.deny", text = ":" } } },
] }
restores = ["box:ftp"]
adds = []

[[post]]
op = "kv.set"
path = "/etc/vsftpd/vsftpd.conf"
values = { tcp_wrappers = "NO" }

[meta]
name = "vsftpd-drop-tcp-wrappers"
author = "claude-opus-5-5 medium (dep-lab grow mode, box B)"
curated_by = "claude (wend port to typed ops)"
source = "dep-lab centos/fixes-v3.json: a9-vsftpd-drop-tcp-wrappers"
note = "EL9's vsftpd is built without libwrap and refuses tcp_wrappers=YES. Setting NO is harmless where it was never on, so this fires only where hosts.allow and hosts.deny contain no rules, where wrappers had nothing to enforce. A box with any rule there hits a route gap."
fires_on = ["el/centos4-dns", "el/centos5-dns"]
