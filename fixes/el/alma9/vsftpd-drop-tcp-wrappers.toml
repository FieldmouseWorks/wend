# Ported from dep-lab's CentOS fix library: same steps, now typed ops (SPEC.md, Op reference).
schema = "wend.fix/0"
family = "el"
hop = "alma9"
# Not where hosts.allow/deny name vsftpd or deny ALL: EL9's vsftpd can't honour them, and dropping them would open
# FTP to everyone. Such a box hits a route gap. (The stock files are comments only.)
when = { all = [
  { installed = "vsftpd" },
  { not = { file-contains = { path = "/etc/hosts.allow", text = "vsftpd" } } },
  { not = { file-contains = { path = "/etc/hosts.deny", text = "vsftpd" } } },
  { not = { file-contains = { path = "/etc/hosts.deny", text = "ALL" } } },
] }
restores = ["box:ftp"]
adds = []

[[post]]
op = "kv.set"
path = "/etc/vsftpd/vsftpd.conf"
values = { tcp_wrappers = "NO" }

[meta]
name = "vsftpd-drop-tcp-wrappers"
author = "claude-opus-5-5 medium (dep-lab grow mode, box B)"
curated_by = "claude (wend port to typed ops)"
source = "dep-lab centos/fixes-v3.json: a9-vsftpd-drop-tcp-wrappers"
note = "EL9's vsftpd is built without libwrap and refuses tcp_wrappers=YES. Setting NO is harmless where it was never on, so this is gated on vsftpd plus hosts.allow/deny having no vsftpd or ALL rules (a text match can't tell a commented tcp_wrappers line from a live one). hosts.allow/deny stop applying to vsftpd."
fires_on = ["el/centos5-dns"]
