# Ported from dep-lab's CentOS fix library: same steps, now typed ops (SPEC.md, Op reference).
schema = "wend.fix/0"
family = "el"
hop = "alma9"
when = { all = [{ installed = "mariadb-server" }, { file = "/etc/wend/secrets/app-db" }] }
restores = ["box:db", "box:site"]
adds = []

[[pre]]
op = "kv.unset"
path = "/etc/my.cnf"
keys = ["old_passwords"]

[[pre]]
op = "mysql.set-password"
user = "app"
secret = "app-db"

[meta]
name = "mariadb55-rehash-app-password"
author = "claude-opus-5-5 medium (dep-lab guided run A)"
curated_by = "claude (wend port to typed ops)"
source = "dep-lab centos/fixes-v3.json: a9-mariadb-rehash-and-clean-stop"
note = "Local fix: it names this box's app account (app) and secret (app-db). Rehashes the app account's MySQL 4.0-style 16-character hash (CentOS 5's old_passwords=1). Fires only where the box's owner has put the app's plaintext in /etc/wend/secrets/app-db; the fix never carries it. Unsets old_passwords only in that spelling (the adapter allows no other key); el9-mariadb-config replaces the stock file anyway."
fires_on = ["el/centos5-web", "el/centos7-lamp", "el/sl7-lamp"]
