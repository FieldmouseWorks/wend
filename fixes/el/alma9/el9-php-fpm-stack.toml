# Ported from dep-lab's CentOS fix library: same steps, now typed ops (SPEC.md, Op reference).
schema = "wend.fix/0"
family = "el"
hop = "alma9"
when = { all = [{ installed = "httpd" }, { installed = "php" }] }
restores = ["box:site", "box:php"]
adds = []

[[post]]
op = "install"
packages = ["php", "php-cli", "php-fpm", "httpd"]

[meta]
name = "el9-php-fpm-stack"
author = "claude-opus-5-5 medium (dep-lab guided run A)"
curated_by = "claude (wend port to typed ops)"
source = "dep-lab centos/fixes-v3.json: a9-install-web-php"
note = "EL9 has no mod_php: PHP runs as php-fpm behind httpd. el9-enable-php-fpm enables php-fpm at boot wherever httpd starts."
fires_on = ["el/centos5-web", "el/centos7-lamp", "el/centos8-lamp", "el/sl7-lamp"]
