# Ported from dep-lab's CentOS fix library: same steps, now typed ops (SPEC.md, Op reference).
schema = "wend.fix/0"
family = "el"
hop = "alma9"
# Only where /etc/my.cnf has none of the settings an owner would miss: the packaged file replaces it. A custom
# datadir, a bind-address or skip-networking, binary logging or replication is a route gap, not something to drop.
when = { all = [
  { installed = "mariadb-server" },
  { file-contains = { path = "/etc/my.cnf", text = "datadir=/var/lib/mysql" } },
  # file-contains is a substring test: rule out datadirs that only share the default's prefix (mysql-prod, mysql/data).
  { not = { file-contains = { path = "/etc/my.cnf", text = "datadir=/var/lib/mysql-" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "datadir=/var/lib/mysql/" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "datadir=/var/lib/mysql_" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "datadir=/var/lib/mysql." } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "datadir=/var/lib/mysql0" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "datadir=/var/lib/mysql1" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "datadir=/var/lib/mysql2" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "datadir=/var/lib/mysql3" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "datadir=/var/lib/mysql4" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "datadir=/var/lib/mysql5" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "datadir=/var/lib/mysql6" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "datadir=/var/lib/mysql7" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "datadir=/var/lib/mysql8" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "datadir=/var/lib/mysql9" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "bind-address" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "skip-networking" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "log-bin" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "server-id" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "bind_address" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "skip_networking" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "log_bin" } } },
  { not = { file-contains = { path = "/etc/my.cnf", text = "server_id" } } },
] }
restores = ["box:db"]
adds = []

[[post]]
op = "rpm.adopt-rpmnew"
paths = ["/etc/my.cnf"]

[[post]]
op = "mysql.upgrade-data"

[meta]
name = "el9-mariadb-config"
author = "claude-opus-5-5 medium (dep-lab guided run A)"
curated_by = "claude (wend port to typed ops)"
source = "dep-lab centos/fixes-v3.json: a9-mariadb-upgrade"
note = "EL9 leaves its packaged /etc/my.cnf (just !includedir /etc/my.cnf.d) as .rpmnew; this takes it, keeps the old file under /var/lib/wend/saved, and upgrades the data files. Fires only when the old file has the default datadir and no bind-address, skip-networking, log-bin or server-id (dashed or underscored). Other server settings in the old file (buffer sizes, max_connections) are not carried over: re-apply them in /etc/my.cnf.d."
fires_on = ["el/centos5-web"]
