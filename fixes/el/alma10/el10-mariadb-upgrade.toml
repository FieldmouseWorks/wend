# Ported from dep-lab's CentOS fix library: same steps, now typed ops (SPEC.md, Op reference).
schema = "wend.fix/0"
family = "el"
hop = "alma10"
when = { installed = "mariadb-server" }
restores = ["box:db"]
adds = []

# mariadb-upgrade lives in mariadb-server-utils, which the server only weakly pulls in. Without it the stale
# EL7 mysql_upgrade ran instead and the data files were never upgraded.
[[post]]
op = "install"
packages = ["mariadb-server-utils"]

[[post]]
op = "mysql.upgrade-data"

[meta]
name = "el10-mariadb-upgrade"
author = "claude-opus-5-5 medium (dep-lab guided run A)"
curated_by = "claude (wend port to typed ops)"
source = "dep-lab centos/fixes-v3.json: a10-mariadb-upgrade"
fires_on = ["el/centos5-web", "el/centos7-lamp", "el/centos7-pyapp", "el/centos8-lamp"]
