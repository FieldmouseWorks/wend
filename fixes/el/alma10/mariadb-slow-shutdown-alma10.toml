# Ported from dep-lab's CentOS fix library: same steps, now typed ops (SPEC.md, Op reference).
schema = "wend.fix/0"
family = "el"
hop = "alma10"
when = { installed = "mariadb-server" }
restores = ["box:db"]
adds = []

[[pre]]
op = "mysql.clean-shutdown"

[meta]
name = "mariadb-slow-shutdown-alma10"
author = "claude-opus-5-5 medium (dep-lab guided run A)"
curated_by = "claude (wend port to typed ops)"
source = "dep-lab centos/fixes-v3.json: a10-mariadb-clean-stop"
note = "Stops MariaDB 10.5 with innodb_fast_shutdown=0 before the hop: MariaDB 10.11 refuses 10.5's redo log after an unclean stop."
fires_on = ["el/centos5-web", "el/centos7-lamp"]
