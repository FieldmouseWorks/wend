# Ported from dep-lab's CentOS fix library: same steps, now typed ops (SPEC.md, Op reference).
schema = "wend.fix/0"
family = "el"
hop = "alma10"
when = { all = [{ installed = "httpd" }, { installed = "php" }] }
restores = ["box:site", "box:php"]
adds = []

[[post]]
op = "rpm.adopt-rpmnew"
paths = ["/etc/httpd/conf/httpd.conf", "/etc/httpd/conf.d/*.conf", "/etc/httpd/conf.modules.d/*.conf", "/etc/php.ini", "/etc/php-fpm.conf", "/etc/php-fpm.d/*.conf"]

[[post]]
op = "rpm.set-aside-unowned"
paths = ["/etc/httpd/conf.modules.d/*.conf", "/etc/php.d/*.ini"]

[[post]]
op = "httpd.drop-missing-modules"

[meta]
name = "el10-httpd-php-config"
author = "claude-opus-5-5 medium (dep-lab guided run A)"
curated_by = "claude (wend port to typed ops)"
source = "dep-lab centos/fixes-v3.json: a10-httpd-php-config"
note = "Takes every packaged httpd and PHP config rpm left as .rpmnew (httpd.conf, conf.d, conf.modules.d, php.ini, php-fpm.conf and pools) and sets aside unowned module configs and php.d/*.ini files (an admin's zz-local.ini included). The owner's changes are NOT carried over: the old files are under /var/lib/wend/saved, re-apply them."
fires_on = ["el/centos5-web"]
