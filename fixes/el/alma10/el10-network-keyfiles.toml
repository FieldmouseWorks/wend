# Found replaying the route on a real CentOS 5.11 install in a VM (wend#13).
schema = "wend.fix/0"
family = "el"
hop = "alma10"
when = { installed = "NetworkManager" }
restores = []
adds = []

[[pre]]
op = "net.ifcfg-to-keyfile"

[meta]
name = "el10-network-keyfiles"
author = "claude (wend#13, hand-written from the VM replay)"
source = "wend#13"
note = "EL10's NetworkManager has no ifcfg-rh plugin, so the static ifcfg-eth0 that EL9's NetworkManager still read (el9-networkmanager) is ignored after the reboot: the box comes up on DHCP as ens3 (10.0.2.15 instead of 10.0.2.20 in the VM) and nothing reaches it. net.ifcfg-to-keyfile turns each profile into a keyfile and pins the name to its MAC before the transaction. The precondition is NetworkManager itself: the op converts nothing on a box with no ifcfg profiles and refuses, changing nothing, any it can't carry. The network role checks the keyfile in a chroot; the VM replay proves the box answers on its address after the reboot."
fires_on = ["el/centos4-dns", "el/centos5-dns", "el/centos5-web", "el/centos7-junk", "el/centos7-lamp", "el/centos7-pyapp", "el/centos8-lamp", "el/sl7-lamp"]
