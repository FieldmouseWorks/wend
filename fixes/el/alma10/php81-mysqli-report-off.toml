# Ported from dep-lab's CentOS fix library: same steps, now typed ops (SPEC.md, Op reference).
schema = "wend.fix/0"
family = "el"
hop = "alma10"
when = { all = [{ installed = "php" }, { installed = "php-mysqlnd" }] }
restores = ["box:php"]
adds = []

[[post]]
op = "php.mysqli-report-off"

[meta]
name = "php81-mysqli-report-off"
author = "claude-opus-5-5 medium (dep-lab guided run A)"
curated_by = "claude (wend port to typed ops)"
source = "dep-lab centos/fixes-v3.json: a10-httpd-php-config"
note = "Changes PHP's default for every script on the box back to the pre-8.1 one. Right for old mysqli code that checks return values; code written for 8.1+ that expects exceptions should not have this."
fires_on = ["el/centos5-web"]
