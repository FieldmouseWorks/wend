# Ported from dep-lab. Generated by tools/port_oldlinux.py; edit freely, the id follows.
schema = "wend.fix/0"
family = "debian"
hop = "jessie"
when = { file = "/etc/apache2/sites-available/mysite" }
restores = ["box:web"]
adds = []

[[post]]
op = "write-file"
path = "/etc/apache2/sites-available/mysite.local.conf"
content = '''
<VirtualHost *:80>
    ServerName mysite.local
    DocumentRoot /var/www/mysite
    <Directory /var/www/mysite>
        Require all granted
    </Directory>
</VirtualHost>
'''

[[post]]
op = "apache.enable"
kind = "site"
name = "mysite.local"

[meta]
name = "apache24-site-conf"
author = "claude-haiku-5-5 (guided runs)"
curated_by = "claude (dep-lab)"
lab_note = "r2/r3 (r1 copied the old file instead)"
lab_name = "apache24-site-conf"
source = "dep-lab oldlinux/fixes-v3.json"
fires_on = ["debian/etch-web"]
